<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Plan de estudio, teoria, formulas explicadas, casos resueltos y ejercicios de Fundamentos de Estadistica (Grado en Psicologia).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
<style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Estadística Armairua</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F1F3F7; --surface:#FFFFFF; --surface2:#E8ECF3; --sunk:#DFE5EE;
  --ink:#16202E; --ink2:#505C6E; --ink3:#78848F;
  --line:#D2DAE6; --line2:#BCC7D8;
  --indigo:#2E4A7D; --indigo-soft:#DDE5F4;
  --ochre:#9B6708; --ochre-soft:#F6EAD3;
  --brick:#9C3327; --brick-soft:#F7E1DD;
  --sage:#2C6656; --sage-soft:#DCECE6;
  --shadow:0 1px 2px rgba(22,32,46,.06), 0 8px 24px -14px rgba(22,32,46,.28);
  --d:'Zilla Slab', Georgia, serif;
  --b:'Source Serif 4', Georgia, serif;
  --u:'IBM Plex Sans', system-ui, sans-serif;
  --m:'IBM Plex Mono', ui-monospace, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E141C; --surface:#161E29; --surface2:#1D2734; --sunk:#121A24;
    --ink:#E3E9F2; --ink2:#9EAABB; --ink3:#78849A;
    --line:#2A3648; --line2:#3A4859;
    --indigo:#8FADE2; --indigo-soft:#1E2C44;
    --ochre:#D9A343; --ochre-soft:#33280F;
    --brick:#E08A7E; --brick-soft:#3A211C;
    --sage:#6FBEA7; --sage-soft:#16302A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E141C; --surface:#161E29; --surface2:#1D2734; --sunk:#121A24;
  --ink:#E3E9F2; --ink2:#9EAABB; --ink3:#78849A;
  --line:#2A3648; --line2:#3A4859;
  --indigo:#8FADE2; --indigo-soft:#1E2C44;
  --ochre:#D9A343; --ochre-soft:#33280F;
  --brick:#E08A7E; --brick-soft:#3A211C;
  --sage:#6FBEA7; --sage-soft:#16302A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--b);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--d);margin:0;text-wrap:balance;line-height:1.2}
button{font-family:var(--u);cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
.prose{max-width:68ch}

/* ---------- topbar ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:60px}
.brand{font-family:var(--d);font-weight:700;font-size:19px;letter-spacing:-.01em;
  display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.brand em{font-style:normal;font-weight:500;color:var(--ochre)}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tab{font-family:var(--u);font-size:13.5px;font-weight:500;border:0;background:none;
  color:var(--ink2);padding:7px 12px;border-radius:6px}
.tab:hover{background:var(--surface2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--ink2);
  width:32px;height:32px;border-radius:6px;font-size:14px;line-height:1;display:grid;place-items:center}
.themebtn:hover{border-color:var(--line2);color:var(--ink)}

/* ---------- perfil ---------- */
.perfilbtn{display:flex;flex-direction:column;align-items:flex-start;gap:0;line-height:1.15;
  border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 11px;text-align:left}
.perfilbtn:hover{border-color:var(--line2)}
.perfilbtn .pnom{font-family:var(--u);font-size:13px;font-weight:600;color:var(--ink)}
.perfilbtn .pest{font-family:var(--m);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.perfilbtn .pest.ok{color:var(--sage)} .perfilbtn .pest.error{color:var(--brick)}
.perfilbtn .pest.guardando{color:var(--ochre)}
.gate{position:fixed;inset:0;z-index:60;background:rgba(10,16,24,.55);
  display:grid;place-items:center;padding:22px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:26px 28px;max-width:460px;width:100%;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);position:relative}
.gcard h3{font-size:22px;margin-bottom:10px}
.gclose{position:absolute;top:12px;right:14px;border:0;background:none;color:var(--ink3);font-size:15px;padding:4px}
.gclose:hover{color:var(--ink)}
.gform{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.gform input{flex:1;min-width:150px;font-family:var(--u);font-size:15px;padding:9px 12px;
  border:1px solid var(--line2);border-radius:8px;background:var(--paper);color:var(--ink)}
.gbtn{border:0;background:var(--indigo);color:var(--paper);font-size:14px;font-weight:600;
  padding:9px 18px;border-radius:8px}
.gbtn:disabled{opacity:.6}
.gerr{font-size:13.5px;color:var(--brick);margin:0 0 10px}
.gcard code{font-family:var(--m);font-size:13px;background:var(--surface2);padding:1px 5px;border-radius:4px}

/* ---------- notas ---------- */
.nota-box{border-top:1px dashed var(--line2);padding-top:6px;margin-top:2px}
.nota-box summary{font-family:var(--u);font-size:11.5px;font-weight:600;color:var(--ink3);
  cursor:pointer;list-style:none;display:flex;gap:5px;align-items:center}
.nota-box summary::-webkit-details-marker{display:none}
.nota-box summary::before{content:"✎";color:var(--ochre)}
.nota-box .nmark{color:var(--ochre);font-weight:500}
.nota-in{width:100%;margin-top:6px;font-family:var(--b);font-size:13.5px;line-height:1.45;
  padding:7px 9px;border:1px solid var(--line);border-radius:6px;resize:vertical;
  background:var(--paper);color:var(--ink)}
.nota-tema{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px 16px;margin-bottom:24px}
.nota-tema .nota-box{border-top:0;padding-top:0;margin-top:0}
.nota-tema .nota-in{font-size:14.5px;min-height:70px}

/* ---------- simulacros ---------- */
.sim{margin-bottom:22px}
.simhd{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-start}
.simkpi{display:flex;gap:16px}
.simkpi div{display:flex;flex-direction:column;text-align:right}
.simkpi .l{font-family:var(--u);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.simkpi .v{font-family:var(--m);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.simsvg{width:100%;height:44px;display:block;margin:14px 0 4px}
.simform{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;align-items:end;
  margin:14px 0;padding:14px;background:var(--sunk);border:1px solid var(--line);border-radius:9px}
.simform label{display:flex;flex-direction:column;gap:4px;font-family:var(--u);font-size:11px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.simform label.ancho{grid-column:1/-1}
.simform input{font-family:var(--u);font-size:14px;padding:7px 10px;border:1px solid var(--line2);
  border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
.simform .gbtn{white-space:nowrap;padding:9px 16px;align-self:end;line-height:1.2}
.simtab td{font-size:13.5px}
.simdel{border:0;background:none;color:var(--ink3);font-size:12px;padding:2px 6px}
.simdel:hover{color:var(--brick)}
.testext{margin-bottom:16px}
.testlist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.testrow{display:flex;align-items:center;gap:13px;padding:11px 13px;border:1px solid var(--line);
  border-radius:9px;background:var(--sunk);text-decoration:none;color:var(--ink)}
.testrow:hover{border-color:var(--indigo);background:var(--surface)}
.testrow .tt-tema{font-family:var(--m);font-size:11px;font-weight:600;letter-spacing:.04em;
  color:var(--indigo);background:var(--indigo-soft);border-radius:6px;padding:5px 7px;
  min-width:52px;text-align:center;white-space:nowrap}
.testrow .tt-body{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.testrow .tt-tit{font-size:14.5px;font-weight:500;line-height:1.3}
.testrow .tt-meta{font-family:var(--u);font-size:11.5px;color:var(--ink3)}
.testrow .tt-go{font-family:var(--u);font-size:12px;font-weight:600;color:var(--indigo);white-space:nowrap}

/* ---------- countdown strip ---------- */
.strip{background:var(--sunk);border-bottom:1px solid var(--line)}
.strip .wrap{display:flex;align-items:center;gap:26px;padding-top:9px;padding-bottom:9px;
  font-family:var(--u);font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.strip b{font-family:var(--m);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{flex:1;min-width:160px;height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--indigo);border-radius:99px}

/* ---------- generic ---------- */
.panel{display:none;padding:34px 0 90px}
.panel.on{display:block}
.eyebrow{font-family:var(--u);font-size:11px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink3)}
.lead{color:var(--ink2);font-size:17px;max-width:64ch;margin:10px 0 0}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:26px}
.hd h2{font-size:30px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--u);font-size:12.5px;font-weight:500;border:1px solid var(--line);
  background:var(--surface);color:var(--ink2);padding:5px 11px;border-radius:99px}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--paper)}

/* ---------- calendario ---------- */
.week{display:grid;grid-template-columns:164px 1fr;gap:16px;padding:18px 0;
  border-top:1px solid var(--line)}
.week:first-of-type{border-top:0}
.wmeta{position:sticky;top:76px;align-self:start}
.wnum{font-family:var(--m);font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.06em}
.wobj{font-family:var(--d);font-size:17px;font-weight:600;margin-top:3px}
.wrange{font-family:var(--u);font-size:12px;color:var(--ink3);margin-top:4px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1180px){.days{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.days{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.days{grid-template-columns:1fr}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 13px;
  display:flex;flex-direction:column;gap:7px;position:relative}
.day.done{background:var(--sage-soft);border-color:var(--sage)}
.day.hoy{box-shadow:0 0 0 2px var(--ochre)}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dfecha{font-family:var(--m);font-size:11px;font-weight:600;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.dtit{font-family:var(--u);font-size:13.5px;font-weight:600;line-height:1.35}
.dcont{font-size:13.5px;color:var(--ink2);line-height:1.5}
.dtarea{font-family:var(--u);font-size:12px;color:var(--ink2);border-top:1px dashed var(--line2);
  padding-top:7px;margin-top:auto}
.dtarea::before{content:"Tarea · ";font-weight:600;color:var(--ochre)}
.tick{border:1px solid var(--line2);background:var(--surface);width:22px;height:22px;border-radius:5px;
  display:grid;place-items:center;font-size:12px;color:var(--ink3);padding:0;flex:none}
.tick[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:#fff}
.day.festivo{background:var(--surface2);border-style:dashed}
.day.examen{background:var(--brick-soft);border-color:var(--brick)}
.day.examen .dtit{color:var(--brick);font-family:var(--d);font-size:17px;letter-spacing:.04em}

/* ---------- temas ---------- */
.tema-nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:30px}
.tcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:13px 15px;display:flex;flex-direction:column;gap:3px}
.tcard:hover{border-color:var(--line2)}
.tcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tcard .n{font-family:var(--m);font-size:11px;font-weight:600;color:var(--ochre);letter-spacing:.08em}
.tcard .t{font-family:var(--d);font-size:16px;font-weight:600;color:var(--ink);line-height:1.25}
.tcard .s{font-family:var(--u);font-size:12px;color:var(--ink3)}
.sec{margin:0 0 34px}
.sec h3{font-size:21px;margin-bottom:8px;display:flex;align-items:baseline;gap:9px}
.sec h3 .num{font-family:var(--m);font-size:12.5px;font-weight:600;color:var(--ochre)}
.sec p{margin:.55em 0}
.sec ul{margin:.5em 0;padding-left:1.15em}
.sec li{margin:.3em 0}
.nota{background:var(--indigo-soft);border-left:3px solid var(--indigo);padding:11px 15px;
  border-radius:0 7px 7px 0;font-size:14.5px;margin:14px 0;max-width:68ch}
.nota b{color:var(--indigo)}
.alerta{background:var(--brick-soft);border-left:3px solid var(--brick)}
.alerta b{color:var(--brick)}
.f{font-family:var(--m);font-size:14.5px;background:var(--surface2);border:1px solid var(--line);
  border-radius:7px;padding:9px 13px;display:inline-block;margin:4px 6px 4px 0;white-space:nowrap}
.fbig{display:block;text-align:center;font-size:16px;padding:14px;margin:14px 0;max-width:68ch;white-space:normal}
.par{color:var(--indigo);font-weight:600}
.est{color:var(--ochre);font-weight:600}

/* ---------- glosario ---------- */
.glos{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.gitem{background:var(--surface);padding:12px 15px}
.gitem dt{font-family:var(--u);font-size:14px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.gitem .sym{font-family:var(--m);font-size:13px;font-weight:600;padding:1px 6px;border-radius:4px;
  background:var(--surface2);color:var(--ink2)}
.gitem dt.p .sym{background:var(--indigo-soft);color:var(--indigo)}
.gitem dt.e .sym{background:var(--ochre-soft);color:var(--ochre)}
.gitem dd{margin:4px 0 0;font-size:14px;color:var(--ink2);line-height:1.5}

/* ---------- casos ---------- */
.caso{background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:20px 22px;margin:0 0 16px;box-shadow:var(--shadow)}
.caso h4{font-size:18px;margin-bottom:6px}
.caso .enun{font-size:15px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:13px}
.pasos{counter-reset:p;list-style:none;padding:0;margin:15px 0 0}
.pasos li{counter-increment:p;display:grid;grid-template-columns:26px 1fr;gap:12px;
  padding:10px 0;border-top:1px solid var(--line)}
.pasos li:first-child{border-top:0}
.pasos li::before{content:counter(p);font-family:var(--m);font-size:11.5px;font-weight:600;
  color:var(--ink3);background:var(--surface2);border-radius:5px;width:26px;height:22px;
  display:grid;place-items:center}
.pasos .pt{font-family:var(--u);font-size:13.5px;font-weight:600;margin-bottom:2px}
.pasos .pc{font-size:14.5px;color:var(--ink2)}
.pasos .pc .f{font-size:13.5px;margin:5px 4px 2px 0}
.resu{background:var(--sage-soft);border:1px solid var(--sage);border-radius:8px;
  padding:12px 15px;margin-top:15px;font-size:15px}
.resu b{color:var(--sage);font-family:var(--u);font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;display:block;margin-bottom:3px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
@media(max-width:620px){.tools{grid-template-columns:1fr}}
.tool{border:1px solid var(--line);border-radius:8px;padding:10px 13px;background:var(--sunk)}
.tool .lab{font-family:var(--u);font-size:11px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.tool code{font-family:var(--m);font-size:13px;color:var(--ink);word-break:break-word}

/* ---------- fórmulas ---------- */
.bloque{margin:0 0 40px}
.bloque-hd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding-bottom:10px;margin-bottom:16px;border-bottom:2px solid var(--ink)}
.bloque-hd h3{font-size:22px}
.bchip{font-family:var(--u);font-size:12px;color:var(--ink3)}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  margin:0 0 14px;overflow:hidden;box-shadow:var(--shadow)}
.fhd{padding:18px 22px 16px;border-bottom:1px solid var(--line);background:var(--sunk)}
.fmeta{font-family:var(--m);font-size:11px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink3)}
.fhd h4{font-size:19px;margin:3px 0 12px}
.fform{font-family:var(--m);font-size:16px;font-weight:500;color:var(--indigo);
  background:var(--surface);border:1px solid var(--line2);border-radius:8px;
  padding:12px 16px;overflow-x:auto;white-space:nowrap}
.fbody{display:grid;grid-template-columns:1fr 1fr;gap:0}
.fcol{padding:16px 22px}
.fcol+.fcol{border-left:1px solid var(--line)}
.fcard h5{font-family:var(--u);font-size:11px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3);margin:0 0 5px}
.fcol h5+p{margin:0 0 15px;font-size:14.5px;color:var(--ink2);line-height:1.55}
.fcol h5+p:last-child{margin-bottom:0}
dl.fsim{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0 0 15px;align-items:baseline}
dl.fsim dt{font-family:var(--m);font-size:13.5px;font-weight:600;color:var(--ink);
  background:var(--surface2);border-radius:5px;padding:2px 7px;white-space:nowrap}
dl.fsim dd{margin:0;font-size:14px;color:var(--ink2);line-height:1.45}
.chip.mini{font-size:11.5px;padding:3px 9px}
.fcaso{padding:16px 22px;border-top:1px solid var(--line);background:var(--surface)}
.fenun{font-size:14.5px;color:var(--ink2);margin:0}
.fcaso .pasos{margin-top:8px}
.fcaso .resu{margin-top:12px}
.fojo{margin:0;border-radius:0;border-left-width:4px;font-size:14px}
.fojo b{font-family:var(--u);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ztab{max-height:400px;overflow:auto}
.ztab table{font-size:12.5px}
.ztab th,.ztab td{padding:4px 7px;white-space:nowrap}
.ztab thead th,.ztab tr:first-child th{position:sticky;top:0;background:var(--surface);z-index:1}
.gitem.flash{animation:fl 2.2s ease-out}
@keyframes fl{0%,55%{background:var(--ochre-soft)}100%{background:var(--surface)}}
@media(max-width:720px){.fbody{grid-template-columns:1fr}.fcol+.fcol{border-left:0;border-top:1px solid var(--line)}}

/* ---------- ejercicios ---------- */
.ej{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:17px 19px;margin-bottom:12px}
.ejh{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.badge{font-family:var(--m);font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--ink2)}
.badge.t{background:var(--indigo-soft);color:var(--indigo)}
.badge.v{background:var(--ochre-soft);color:var(--ochre)}
.badge.d{background:var(--sage-soft);color:var(--sage)}
.ejq{font-size:15.5px;font-weight:600;font-family:var(--u);line-height:1.45}
.ops{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.op{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:7px;
  padding:9px 13px;font-family:var(--b);font-size:15px;color:var(--ink);display:flex;gap:10px}
.op:hover:not(:disabled){border-color:var(--line2);background:var(--surface2)}
.op:disabled{cursor:default}
.op .k{font-family:var(--m);font-size:12px;font-weight:600;color:var(--ink3);flex:none;padding-top:2px}
.op.ok{background:var(--sage-soft);border-color:var(--sage)}
.op.no{background:var(--brick-soft);border-color:var(--brick)}
.why{font-size:13.5px;color:var(--ink2);margin-top:7px;padding-left:22px;display:block}
.why b{font-family:var(--u);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.op.ok .why b{color:var(--sage)} .op.no .why b{color:var(--brick)}
.rev{border:1px solid var(--line2);background:var(--surface2);color:var(--ink);
  border-radius:7px;padding:8px 14px;font-size:13px;font-weight:500;margin-top:11px}
.sol{margin-top:12px;padding:13px 15px;background:var(--sunk);border-radius:8px;
  border:1px solid var(--line);font-size:14.5px}
.sol h5{font-family:var(--u);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 6px}
.score{font-family:var(--m);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink2);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 14px;
  display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.score b{color:var(--ink);font-weight:600}

/* ---------- recordatorio ---------- */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:18px 20px}
.card h3{font-size:18px;margin-bottom:4px}
.card .sub{font-family:var(--u);font-size:12.5px;color:var(--ink3);margin-bottom:13px}
table{border-collapse:collapse;width:100%;font-size:14px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--u);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);white-space:nowrap}
td.n{font-family:var(--m);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.zwrap{display:grid;grid-template-columns:1fr;gap:14px}
.zctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--u);font-size:13px}
.zctl input[type=range]{flex:1;min-width:170px;accent-color:var(--indigo)}
.zval{font-family:var(--m);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;
  background:var(--surface2);border-radius:6px;padding:3px 9px;min-width:66px;text-align:center}
.zout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.zbox{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--sunk)}
.zbox .l{font-family:var(--u);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.zbox .v{font-family:var(--m);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.footer{border-top:1px solid var(--line);padding:24px 0 40px;font-family:var(--u);
  font-size:12.5px;color:var(--ink3)}
@media(max-width:760px){
  .week{grid-template-columns:1fr;gap:10px}
  .wmeta{position:static}
  .hd h2{font-size:24px}
  .top .wrap{height:auto;padding-top:9px;padding-bottom:9px;flex-wrap:wrap}
  .tabs{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
const CAL = [{"f":"2026-09-07","tema":"T1","tit":"Para qué sirve la estadística en psicología","cont":"Descriptiva vs. inferencial. Los tres objetivos del método: descriptivo, explicativo y predictivo.","tarea":"Escribe un ejemplo propio de cada objetivo (descriptivo, explicativo, predictivo).","tipo":"sesion"},{"f":"2026-09-08","tema":"T1","tit":"Método científico: proceso cíclico","cont":"Deducción (teoría → datos) e inducción (datos → teoría). El ciclo hipótesis ↔ datos.","tarea":"Dibuja el ciclo de memoria y sitúa dónde va cada flecha.","tipo":"sesion"},{"f":"2026-09-09","tema":"T1","tit":"Nivel teórico-conceptual","cont":"Planteamiento del problema. Hipótesis teóricas vs. empíricas. Las seis condiciones de una hipótesis.","tarea":"Memoriza las 6 condiciones: consistencia, claridad, contraste empírico, poder explicativo, parsimonia, compatibilidad.","tipo":"sesion"},{"f":"2026-09-10","tema":"T1","tit":"Nivel técnico-metodológico: el plan","cont":"Objetivo general vs. específicos. Objetivos NO son hipótesis. Diseño, procedimiento, operativización.","tarea":"Redacta un objetivo general y dos específicos para un estudio inventado.","tipo":"sesion"},{"f":"2026-09-11","tema":"T1","tit":"Población, muestra y muestreo","cont":"Parámetros (μ, σ, π: constantes y desconocidos) vs. estadísticos (x̄, Sx, P: variables y conocidos). Muestreo probabilístico y no probabilístico.","tarea":"Tabla de dos columnas: todo lo que sabes de población frente a muestra.","tipo":"sesion"},{"f":"2026-09-14","tema":"T1","tit":"Escalas de medida","cont":"Categóricas (nominal binaria/politómica), cuasi-cuantitativas (ordinal), cuantitativas (discreta, continua de intervalo, continua de razón).","tarea":"Clasifica 15 variables reales. El 0 de razón significa ausencia; el de intervalo, no.","tipo":"sesion"},{"f":"2026-09-15","tema":"T1","tit":"Rol funcional de las variables","cont":"Variable independiente (VI), dependiente (VD) y extraña o contaminadora (VE).","tarea":"Coge 6 enunciados de investigación y señala VI, VD y VE en cada uno.","tipo":"sesion"},{"f":"2026-09-16","tema":"T1","tit":"Diseños de investigación","cont":"Observacional, selectivo/correlacional y experimental. El eje del control.","tarea":"Ordena los tres métodos según control interno y según naturalidad.","tipo":"sesion"},{"f":"2026-09-17","tema":"T1","tit":"Validez interna y externa","cont":"Interna: relación causal VI→VD, sube al controlar VE, alta en experimentales. Externa: generalización (poblacional, ecológica, temporal), alta en observacionales.","tarea":"Explica en dos frases por qué interna y externa suelen ir en sentidos opuestos.","tipo":"sesion"},{"f":"2026-09-18","tema":"T1","tit":"Matriz de datos y SPSS · Repaso T1","cont":"Filas = sujetos, columnas = variables. Vista de variables vs. vista de datos. Diseño de variables y etiquetas de valor.","tarea":"Resuelve las 5 preguntas V/F del repaso del tema y el test del banco.","tipo":"sesion"},{"f":"2026-09-21","tema":"T2","tit":"Qué describe el análisis descriptivo","cont":"Las tres características de toda distribución: centro, dispersión y forma.","tarea":"Explica con tus palabras por qué el centro solo sirve si la dispersión es pequeña.","tipo":"sesion"},{"f":"2026-09-22","tema":"T2","tit":"Variables categóricas: tabla de frecuencias","cont":"Frecuencia absoluta (ni), relativa (pi = ni/n) y porcentaje (%i = pi·100).","tarea":"Construye una tabla completa a partir de 30 respuestas inventadas.","tipo":"sesion"},{"f":"2026-09-23","tema":"T2","tit":"Gráficos para categóricas","cont":"Diagrama de barras (altura = frecuencia) y diagrama de sectores (proporción del círculo).","tarea":"Dibuja los dos gráficos de la tabla de ayer.","tipo":"sesion"},{"f":"2026-09-24","tema":"T2","tit":"Frecuencias acumuladas","cont":"na, pa y %a. Solo tienen sentido cuando la variable tiene orden (ordinal o cuantitativa).","tarea":"Añade las tres columnas acumuladas a una tabla de nivel de estudios.","tipo":"sesion"},{"f":"2026-09-25","tema":"T2","tit":"Cuantiles: percentiles","cont":"Pk deja por debajo el k% de los casos. Posición j = k(n+1)/100. Si j es entero, Pk = Xj.","tarea":"Calcula P50 de la serie 1,2,2,3,4,5,6,7,9.","tipo":"sesion"},{"f":"2026-09-28","tema":"T2","tit":"Percentiles con posición decimal","cont":"Si j es decimal: Pk = (1−d)·Xi + d·Xi+1, donde d es la parte decimal de j.","tarea":"Calcula P35 de la misma serie y comprueba que da 2,5.","tipo":"sesion"},{"f":"2026-09-29","tema":"T2","tit":"Cuartiles y mediana","cont":"Q1 = P25, Q2 = P50 = Mdn, Q3 = P75. Cálculo con n par y con n impar.","tarea":"Halla Q1, Q2 y Q3 de una serie de 8 valores y de otra de 9.","tipo":"sesion"},{"f":"2026-09-30","tema":"T2","tit":"Media aritmética y puntuación diferencial","cont":"x̄ = Σxi/n, el centro de gravedad. Puntuación diferencial xi = Xi − x̄; su suma es siempre 0.","tarea":"Calcula la media y las diferenciales de 2,3,4,5,3,1 y comprueba que suman 0.","tipo":"sesion"},{"f":"2026-10-01","tema":"T2","tit":"Propiedades ante transformaciones lineales","cont":"Y = a + bX. La media: ȳ = a + b·x̄. La varianza: S²y = b²·S²x. La desviación típica: Sy = |b|·Sx. Sumar una constante no cambia la dispersión.","tarea":"Verifica las tres propiedades con k=1 y con k=−2 sobre la misma serie.","tipo":"sesion"},{"f":"2026-10-02","tema":"T2","tit":"Moda y tipos de distribución modal","cont":"Valor con mayor frecuencia absoluta. Unimodal, bimodal, trimodal, polimodal y amodal.","tarea":"Inventa una serie de cada tipo modal.","tipo":"sesion"},{"f":"2026-10-05","tema":"T2","tit":"Amplitud total y amplitud intercuartil","cont":"AT = máx − mín (muy sensible a atípicos). AIQ = Q3 − Q1, contiene el 50% central y es robusta.","tarea":"Calcula AT y AIQ del ejemplo con media 24,90 y percentiles del tema.","tipo":"sesion"},{"f":"2026-10-06","tema":"T2","tit":"Varianza y desviación típica","cont":"S² = Σ(Xi − x̄)²/n. Se eleva al cuadrado para que las diferenciales no se anulen. DT = √S², en las unidades originales.","tarea":"Calcula S² y DT de 2,3,1,5,3,5,7,2,3 (media 3,44).","tipo":"sesion"},{"f":"2026-10-07","tema":"T2","tit":"Coeficiente de variación de Pearson","cont":"CV = (Sx / x̄)·100. Dispersión relativa: permite comparar variables con distinta unidad o media muy distinta. Orientativo: >50 mucha heterogeneidad.","tarea":"Compara la homogeneidad de dos grupos con medias y DT distintas.","tipo":"sesion"},{"f":"2026-10-08","tema":"T2","tit":"Asimetría y curtosis","cont":"Asimetría positiva: cola a la derecha, más casos en valores bajos. Negativa: al revés. Curtosis: grado de apuntamiento.","tarea":"Dibuja las tres formas y sitúa media, mediana y moda en cada una.","tipo":"sesion"},{"f":"2026-10-09","tema":"T2","tit":"Gráficos cuantitativos · Repaso T2","cont":"Histograma, diagrama de tallo y hojas (conserva los valores originales) y caja y bigotes (basado en cuartiles).","tarea":"Resuelve las 5 V/F del repaso del tema y los problemas del banco.","tipo":"sesion"},{"f":"2026-10-12","tema":"—","tit":"Festivo: Fiesta Nacional","cont":"Día colchón. Úsalo solo si arrastras algo pendiente.","tarea":"","tipo":"festivo"},{"f":"2026-10-13","tema":"T3","tit":"Por qué la probabilidad sostiene la inferencia","cont":"Leyes deterministas (ciencias formales) vs. probabilísticas (psicología). Aleatoriedad y variabilidad.","tarea":"Escribe un ejemplo de ley determinista y otro de ley probabilística.","tipo":"sesion"},{"f":"2026-10-14","tema":"T3","tit":"Experimento aleatorio, espacio muestral y suceso","cont":"EA: resultado impredecible, repetible en las mismas condiciones. E = conjunto de resultados posibles. Suceso = cada resultado posible.","tarea":"Define E para: lanzar dos monedas, lanzar un dado, extraer una carta.","tipo":"sesion"},{"f":"2026-10-15","tema":"T3","tit":"Tipos de suceso","cont":"Simple o elemental, compuesto, complementario, seguro (todo E) e imposible (∅).","tarea":"Pon un ejemplo de cada tipo con el lanzamiento de un dado.","tipo":"sesion"},{"f":"2026-10-16","tema":"T3","tit":"Operaciones con sucesos","cont":"Unión (A∪B, «o», suma), intersección (A∩B, «y», producto), diferencia (A−B) e incompatibilidad (A∩B = ∅).","tarea":"Con A = {2,4,6} y B = {3,4,5,6}: calcula A∪B, A∩B y A−B.","tipo":"sesion"},{"f":"2026-10-19","tema":"T3","tit":"Definición y cálculo de la probabilidad","cont":"P(A) = casos favorables / casos posibles. Está entre 0 y 1: 0 el suceso imposible, 1 el seguro. Ley de los grandes números.","tarea":"Calcula la probabilidad de sacar un número mayor que 4 en un dado.","tipo":"sesion"},{"f":"2026-10-20","tema":"T3","tit":"Regla de la suma","cont":"Sucesos excluyentes: P(A∪B) = P(A) + P(B). No excluyentes: P(A∪B) = P(A) + P(B) − P(A∩B).","tarea":"Resuelve tres uniones, una de ellas con sucesos no excluyentes.","tipo":"sesion"},{"f":"2026-10-21","tema":"T3","tit":"Probabilidad condicionada","cont":"P(A|B) = P(A∩B)/P(B). La ocurrencia de B cambia la probabilidad de A.","tarea":"Construye una tabla 2×2 y calcula todas las condicionadas posibles.","tipo":"sesion"},{"f":"2026-10-22","tema":"T3","tit":"Independencia y dependencia","cont":"Independientes si P(A|B) = P(A), y entonces P(A∩B) = P(A)·P(B). Si no, son dependientes.","tarea":"Comprueba la independencia en la tabla de ayer.","tipo":"sesion"},{"f":"2026-10-23","tema":"T3","tit":"H0, H1 y el nivel de significación · Repaso T3","cont":"H0: lo que estudiamos no ocurre, se pone a prueba. H1: sí ocurre. Con α = .05: si p < .05 se rechaza H0; si p > .05 se mantiene (no se acepta).","tarea":"Resuelve las 5 V/F del repaso del tema.","tipo":"sesion"},{"f":"2026-10-26","tema":"T4","tit":"Asociación y causalidad","cont":"Covariar = los valores de una variable cambian en función de otra. La asociación es requisito de la causalidad, pero no basta.","tarea":"Enumera los tres requisitos de la causalidad.","tipo":"sesion"},{"f":"2026-10-27","tema":"T4","tit":"Relaciones espurias","cont":"Una tercera variable, a veces desconocida, explica la covariación. Consumo de queso y muertes por enredarse en las sábanas: r = 0,94.","tarea":"Busca dos correlaciones absurdas y explica qué tercera variable las genera.","tipo":"sesion"},{"f":"2026-10-28","tema":"T4","tit":"Covarianza","cont":"Sxy = Σ(Xi − x̄)(Yi − ȳ)/n. Signo = dirección. Valores entre −∞ y +∞: no acotada, depende de las unidades, difícil de interpretar.","tarea":"Calcula la covarianza de X = 1,4,0,3,4,2,5,1,1 con Y = 2,3,1,5,3,5,7,2,3.","tipo":"sesion"},{"f":"2026-10-29","tema":"T4","tit":"Correlación de Pearson","cont":"rxy = Sxy/(Sx·Sy). Acotada entre −1 y +1, estandarizada y comparable. Hasta ±0,1 pequeña, ±0,3 mediana, ±0,5 alta.","tarea":"Convierte la covarianza de ayer en r y clasifica su magnitud.","tipo":"sesion"},{"f":"2026-10-30","tema":"T4","tit":"r a partir de la matriz de covarianzas","cont":"En la diagonal están las varianzas; fuera, las covarianzas. rxy = Sxy/(√S²x·√S²y).","tarea":"De la matriz del tema, obtén rZX = 0,747 y rZY = 0,905.","tipo":"sesion"},{"f":"2026-11-02","tema":"T4","tit":"Coeficiente de determinación","cont":"r² = proporción de varianza de Y explicada por X. Entre 0 y 1; se suele leer en porcentaje.","tarea":"Si r = 0,60, ¿qué porcentaje de varianza queda sin explicar?","tipo":"sesion"},{"f":"2026-11-03","tema":"T4","tit":"Tablas de contingencia y frecuencias esperadas","cont":"Cruce de frecuencias absolutas de dos categóricas. eij = (total fila × total columna) / n.","tarea":"Calcula las 6 frecuencias esperadas de la tabla personalidad × sexo.","tipo":"sesion"},{"f":"2026-11-04","tema":"T4","tit":"Ji-cuadrado de Pearson","cont":"χ² = Σ(oij − eij)²/eij. Entre 0 e +∞. No acotado, depende de n y no informa de la intensidad.","tarea":"Completa el cálculo de χ² de la tabla de ayer, celda a celda.","tipo":"sesion"},{"f":"2026-11-05","tema":"T4","tit":"Phi y V de Cramer","cont":"φ = √(χ²/n) para tablas 2×2. V = √(χ²/(n(k−1))) para tablas mayores, con k = nº de categorías de la variable con menos categorías. Ambas acotadas: sí informan de la intensidad.","tarea":"Calcula V de Cramer con el χ² que obtuviste ayer.","tipo":"sesion"},{"f":"2026-11-06","tema":"T4","tit":"Cuantitativa × categórica · Repaso T4","cont":"Comparar el comportamiento de cada grupo: diagrama de caja múltiple (cuartiles) y diagrama de medias.","tarea":"Resuelve los problemas del banco del tema 4.","tipo":"sesion"},{"f":"2026-11-09","tema":"T5","tit":"Qué es inferir","cont":"Estimación (puntual y por intervalos) y prueba de hipótesis. Parámetros: constantes y desconocidos. Estadísticos: aleatorios y conocidos.","tarea":"Escribe los símbolos de los tres parámetros y sus tres estadísticos.","tipo":"sesion"},{"f":"2026-11-10","tema":"T5","tit":"Muestreo y representatividad","cont":"Depende del tipo de muestreo (probabilístico > no probabilístico), la estructura de la muestra y el tamaño. n = 30 suele bastar, pero no garantiza representatividad.","tarea":"Explica por qué una muestra grande puede seguir estando sesgada.","tipo":"sesion"},{"f":"2026-11-11","tema":"T5","tit":"La distribución normal","cont":"Campana de Gauss: simétrica, mesocúrtica y asintótica. N(μ, σ). La normal unitaria es N(0, 1).","tarea":"Dibuja la curva y marca los porcentajes de ±1, ±2 y ±3 DT.","tipo":"sesion"},{"f":"2026-11-12","tema":"T5","tit":"Tipificación","cont":"z = (X − μ)/σ. Misma métrica para todas las variables: centro 0, dispersión 1, unidades de DT.","tarea":"Calcula z para X = 1 en una N(2, 5). Debe darte −0,20.","tipo":"sesion"},{"f":"2026-11-13","tema":"T5","tit":"De z a probabilidad","cont":"Buscar el área bajo la curva con la tabla. Atención a si te piden por debajo, por encima o entre dos valores.","tarea":"P(X > 2,7) en N(2, 5): tipifica y busca en la tabla. Debe dar ≈ 0,4443.","tipo":"sesion"},{"f":"2026-11-16","tema":"T5","tit":"De probabilidad a z (problema inverso)","cont":"Entrar en la tabla por el área y salir con z; luego deshacer la tipificación: X = μ + z·σ.","tarea":"Halla la puntuación directa con probabilidad acumulada 0,95 en N(2, 5).","tipo":"sesion"},{"f":"2026-11-17","tema":"T5","tit":"Distribución muestral de un estadístico","cont":"Distribución teórica de los valores que toma un estadístico en todas las muestras del mismo tamaño extraíbles de una población.","tarea":"Con μ = 302 y σ = 250, calcula los errores muestrales de x̄ = 333, 224, 357 y 573.","tipo":"sesion"},{"f":"2026-11-18","tema":"T5","tit":"Teorema Central del Límite","cont":"Sea cual sea la distribución de la variable, la distribución muestral de la media tiende a la normal al aumentar n. Por eso podemos usar la normal casi siempre.","tarea":"Explica el TCL en cinco líneas sin mirar los apuntes.","tipo":"sesion"},{"f":"2026-11-19","tema":"T5","tit":"Estimación puntual","cont":"Un único valor muestral estima el parámetro. Propiedades deseables: insesgado, eficiente, consistente y suficiente.","tarea":"Define las cuatro propiedades con una frase cada una.","tipo":"sesion"},{"f":"2026-11-20","tema":"T5","tit":"Error estándar","cont":"EE = σ/√n. Variabilidad de la distribución muestral. A mayor n, menor EE y mayor precisión.","tarea":"Calcula el EE con σ = 4 y n = 100, y luego con n = 400. Compara.","tipo":"sesion"},{"f":"2026-11-23","tema":"T5","tit":"Intervalo de confianza con varianza poblacional conocida","cont":"IC = x̄ ± z(1−α/2) · σ/√n. Con α = 0,05, z = 1,96.","tarea":"Con x̄ = 25, σ² = 16, n = 100 y α = 0,05, comprueba que sale [24,216; 25,784].","tipo":"sesion"},{"f":"2026-11-24","tema":"T5","tit":"Intervalo de confianza con varianza desconocida","cont":"Se usa la t de Student con n − 1 grados de libertad. Con n ≥ 30 se aproxima a la normal.","tarea":"Con x̄ = 25, S² = 16, n = 100 y α = 0,01, comprueba que sale [23,95; 26,05].","tipo":"sesion"},{"f":"2026-11-25","tema":"T5","tit":"Contraste de hipótesis: planteamiento","cont":"H0 exacta (=, ≥, ≤) y H1 inexacta (≠, >, <). Excluyentes y exhaustivas. Contraste bilateral, unilateral derecho y unilateral izquierdo.","tarea":"Formula H0 y H1 para cinco enunciados distintos.","tipo":"sesion"},{"f":"2026-11-26","tema":"T5","ti  secs:[
  {num:"1.1", t:"Para qué sirve la estadística en psicología", c:`
   <p>La estadística permite <b>resumir</b> los datos para ver patrones (descriptiva) y <b>generalizar</b> a la población a partir de una muestra (inferencial). Es lo que convierte a la psicología en ciencia: hace los resultados replicables y comparables, y permite evaluar validez y fiabilidad.</p>
   <p>El método científico persigue tres objetivos, y conviene distinguirlos porque el examen los pregunta con ejemplos:</p>
   <ul>
    <li><b>Descriptivo</b> — aislar, clasificar y definir fenómenos, o estudiar la relación entre ellos. <i>Calcular la media de horas de música y el nivel de felicidad, y ver si correlacionan.</i></li>
    <li><b>Explicativo</b> — buscar la causa. <i>Entender por qué escuchar música mejora el estado de ánimo.</i></li>
    <li><b>Predictivo</b> — anticipar cómo se manifestará el fenómeno en condiciones replicables. <i>Estimar si quien escucha música tendrá menos probabilidad de desarrollar depresión.</i></li>
   </ul>`},
  {num:"1.1", t:"El ciclo deducción / inducción", c:`
   <p>El método científico es un proceso cíclico entre dos polos: los <b>datos</b> (hechos, fenómenos, práctica) y las <b>hipótesis</b> (conjeturas, teorías, modelos).</p>
   <ul>
    <li><b>Deducción</b> — de lo general a lo particular: de la teoría a las conclusiones concretas.</li>
    <li><b>Inducción</b> — de lo particular a lo general: de los hechos a la síntesis teórica.</li>
   </ul>
   <div class="nota"><b>Regla mnemotécnica:</b> de<b>D</b>ucción baja <b>D</b>esde la teoría; in<b>D</b>ucción sube desde los datos. Si la frase empieza en la teoría, es deducción.</div>`},
  {num:"1.2", t:"Nivel teórico-conceptual", c:`
   <p>Es el primer nivel del proceso. Contiene el <b>planteamiento del problema</b> (una dificultad que no se resuelve sola y exige investigación) y la <b>formulación de hipótesis</b>.</p>
   <p>Una hipótesis debe cumplir seis condiciones:</p>
   <ul>
    <li><b>Consistencia</b> — sus suposiciones son compatibles entre sí.</li>
    <li><b>Claridad</b> — expresión sencilla y sin ambigüedad.</li>
    <li><b>Contraste empírico</b> — puede ser falsada.</li>
    <li><b>Poder explicativo</b> — explica los hechos implicados.</li>
    <li><b>Parsimonia</b> — no usa más conjeturas de las necesarias.</li>
    <li><b>Compatibilidad</b> — encaja con el conocimiento actual.</li>
   </ul>
   <p>De las <b>hipótesis teóricas o generales</b> (llegadas por inducción) se derivan, por razonamiento hipotético-deductivo, las <b>hipótesis empíricas o de investigación</b>, ya concretas y contrastables.</p>`},
  {num:"1.2", t:"Nivel técnico-metodológico: población y muestra", c:`
   <p>Aquí se decide el plan: objetivos, diseño, procedimiento, operativización de variables, selección de la muestra y recogida de datos. Ojo con una confusión clásica: <b>los objetivos no son hipótesis</b>. El objetivo general es la intención global; los específicos son los hitos para alcanzarlo.</p>
   <p>La distinción que atraviesa toda la asignatura:</p>
   <div class="scroll"><table>
    <tr><th></th><th>Población</th><th>Muestra</th></tr>
    <tr><td>Se describe con</td><td class="par">Parámetros: μ, σ, π</td><td class="est">Estadísticos: x̄, S<sub>x</sub>, P</td></tr>
    <tr><td>Tamaño</td><td class="n">N</td><td class="n">n</td></tr>
    <tr><td>Accesibilidad</td><td>Inaccesible</td><td>Accesible</td></tr>
    <tr><td>Valor</td><td>Constante y desconocido</td><td>Variable y conocido</td></tr>
   </table></div>
   <p>El <b>muestreo probabilístico</b> da a todos los elementos la misma probabilidad de ser elegidos (mayor representatividad); el <b>no probabilístico</b>, no. Ejemplo de cada uno: seleccionar 200 estudiantes de un censo con un software, frente a coger los 200 primeros que responden a un anuncio.</p>`},
  {num:"1.2", t:"Escalas de medida", c:`
   <p>Cómo se mide la variable determina qué análisis se le puede aplicar. Las categorías de una variable deben ser <b>exclusivas</b> (sin solapamiento) y <b>exhaustivas</b> (cubren todas las posibilidades).</p>
   <div class="scroll"><table>

    <tr><td>Cuantitativa</td><td>Continua de intervalo</td><td>Temperatura, fecha, puntuación de un test</td></tr>

   </table></div>
   <div class="nota"><b>La clave del 0:</b> en escala de <b>intervalo</b> el cero es convencional y no indica ausencia (0 ºC no es ausencia de temperatura). En escala de <b>razón</b> el cero sí indica ausencia, y por eso admite multiplicar y dividir.</div>`},
  {num:"1.2", t:"Rol funcional de las variables", c:`
   <ul>
    <li><b>VI, independiente</b> — la que se manipula o define los grupos. Sinónimos: causa, tratamiento, factor, predictora.</li>
    <li><b>VD, dependiente</b> — el resultado que se mide. Sinónimos: efecto, criterio, respuesta.</li>
    <li><b>VE, extraña o contaminadora</b> — la que hay que controlar porque podría sesgar la relación VI→VD.</li>
   </ul>
   <p>Ejemplo del tema: horas de estudio (VI) → calificación final (VD), con el estrés actuando como VE.</p>`},
  {num:"1.2", t:"Diseños y validez", c:`
   <p>Los tres métodos se ordenan en un eje de control, de menos a más:</p>
   <ul>
    <li><b>Observacional</b> (objetivo descriptivo) — máxima naturalidad, control interno escaso o nulo, no hay manipulación de la VI.</li>
    <li><b>Selectivo o correlacional</b> (objetivo correlacional o predictivo) — busca asociaciones; hay algo de manipulación pero no relaciones causales; los participantes se seleccionan por características relevantes.</li>
    <li><b>Experimental</b> (objetivo explicativo) — máxima intervención y control; los grupos se forman al azar, la VI se manipula y se controlan las VE.</li>
   </ul>
   <p>De ahí salen los dos tipos de validez, que tiran en sentidos opuestos:</p>
   <ul>
    <li><b>Validez interna</b> — grado en que la relación VI→VD es causal. Sube al controlar las VE. Alta en diseños experimentales.</li>
    <li><b>Validez externa</b> — grado de generalización a otras poblaciones (poblacional), situaciones (ecológica) o momentos (temporal). Exige muestra representativa. Alta en diseños observacionales.</li>
   </ul>
   <div class="nota alerta"><b>Trampa típica:</b> cuanto más control de laboratorio, más validez interna y <i>menos</i> validez externa. Un diseño no puede maximizar las dos a la vez.</div>`},
  {num:"1.3", t:"Nivel estadístico-analítico y matriz de datos", c:`
   <p>Aquí se transforman los registros en datos tratables: la <b>matriz de datos</b>, una tabla bidimensional donde las <b>filas</b> son los sujetos y las <b>columnas</b> las variables. Después vienen el análisis descriptivo, el inferencial y, cerrando el ciclo, la discusión y generalización de resultados, que devuelve el proceso al nivel teórico-conceptual.</p>
   <p>En SPSS eso se traduce en dos pestañas: <b>vista de variables</b> (donde se diseñan: nombre sin tildes ni espacios, tipo, etiqueta, valores, medida) y <b>vista de datos</b> (donde se introducen las puntuaciones). La variable <b>ID</b> sustituye al nombre del sujeto y permite emparejar medidas pre-post.</p>`}

{
 id:"T2", n:2, tit:"Análisis descriptivo", sub:"Centro, dispersión y forma de la distribución",
 secs:[
  {num:"2.1", t:"Qué describe el análisis descriptivo", c:`
   <p>La estadística descriptiva organiza la información contenida en la matriz de datos para obtener un resumen fiel y con el máximo detalle. Ese resumen tiene siempre <b>tres piezas</b>:</p>
   <ul>
    <li><b>Centro</b> — el valor más repetido (categóricas) o el promedio / punto central (cuantitativas). Señala dónde es más probable encontrar casos.</li>
    <li><b>Dispersión</b> — cuánto se alejan los datos del centro. Sirve para juzgar si ese centro es buen representante.</li>
    <li><b>Forma</b> — cómo se reparten las frecuencias: simetría y apuntamiento.</li>
   </ul>
   <div class="nota"><b>Nunca des un centro sin su dispersión.</b> Una media de 24,9 con DT = 1 y otra con DT = 20 describen realidades opuestas.</div>`},
  {num:"2.1", t:"Variables categóricas: tabla de frecuencias", c:`
   <p>Filas = categorías; columnas = tipos de frecuencia.</p>
   <ul>
    <li><span class="f">n<sub>i</sub></span> <b>frecuencia absoluta</b>: número de veces que se repite cada valor.</li>
    <li><span class="f">p<sub>i</sub> = n<sub>i</sub> / n</span> <b>frecuencia relativa</b>: proporción sobre el total.</li>
    <li><span class="f">%<sub>i</sub> = p<sub>i</sub> · 100</span> <b>porcentaje</b>.</li>
   </ul>
   <div class="scroll"><table>
    <tr><th>Carrera</th><th>n<sub>i</sub></th><th>p<sub>i</sub></th><th>%<sub>i</sub></th></tr>
    <tr><td>Psicología</td><td class="n">26</td><td class="n">0,58</td><td class="n">58 %</td></tr>
    <tr><td>Medicina</td><td class="n">12</td><td class="n">0,27</td><td class="n">27 %</td></tr>
    <tr><td>Trabajo Social</td><td class="n">7</td><td class="n">0,15</td><td class="n">15 %</td></tr>
    <tr><td><b>Total</b></td><td class="n">45</td><td class="n">1,00</td><td class="n">100 %</td></tr>
   </table></div>
   <p>Gráficos propios: <b>diagrama de barras</b> (la altura expresa el número de casos) y <b>diagrama de sectores</b> (la proporción de cada sector es la frecuencia de la categoría).</p>`},
  {num:"2.2", t:"Frecuencias acumuladas", c:`
   <p>Cuando la variable tiene <b>orden</b> (ordinal o cuantitativa) se añaden tres columnas más:</p>
   <ul>
    <li><span class="f">n<sub>a</sub></span> suma sucesiva de n<sub>i</sub>.</li>
    <li><span class="f">p<sub>a</sub></span> suma sucesiva de p<sub>i</sub>.</li>
    <li><span class="f">%<sub>a</sub></span> suma sucesiva de %<sub>i</sub>.</li>
   </ul>
   <div class="nota alerta"><b>Error frecuente:</b> acumular frecuencias de una variable nominal. Sin orden, «acumular» no significa nada: no puedes sumar psicología + medicina y llamarlo «hasta medicina».</div>`},
  {num:"2.2", t:"Cuantiles: percentiles y cuartiles", c:`
   <p>Los <b>cuantiles</b> dividen el conjunto ordenado de valores en q partes iguales. Se construyen sobre la ordenación, así que son <b>resistentes</b> a la asimetría y a los casos atípicos.</p>
   <p>El <b>percentil</b> P<sub>k</sub> es el valor que deja por debajo de sí el k % de los casos. Cálculo en tres pasos:</p>
   <span class="f fbig">1. Ordenar · 2. j = k(n+1)/100 · 3. si j entero → P<sub>k</sub> = X<sub>j</sub>; si j decimal → P<sub>k</sub> = (1−d)·X<sub>i</sub> + d·X<sub>i+1</sub></span>
   <p>donde <b>d</b> es la parte decimal de j. Los <b>cuartiles</b> son tres percentiles concretos:</p>
   <span class="f">Q₁ = P₂₅</span><span class="f">Q₂ = P₅₀ = Mdn</span><span class="f">Q₃ = P₇₅</span>`},
  {num:"2.2", t:"Tendencia central", c:`
   <p><b>Media aritmética</b> — el centro de gravedad de la distribución:</p>
   <span class="f fbig">x̄ = Σ X<sub>i</sub> / n</span>
   <p>La <b>puntuación diferencial</b> x<sub>i</sub> = X<sub>i</sub> − x̄ informa de la distancia de cada caso a la media. Su suma siempre vale 0, y por eso hay que elevarla al cuadrado para medir dispersión.</p>
   <p><b>Mediana (Mdn = P₅₀ = Q₂)</b> — deja el 50 % de los casos por debajo. Coincide con la media si la distribución es simétrica; se usa cuando es asimétrica o hay atípicos, porque es resistente.</p>
   <p><b>Moda</b> — el valor con mayor frecuencia absoluta. Una distribución puede ser unimodal, bimodal, trimodal, polimodal (más de tres) o <b>amodal</b> si todos los valores tienen la misma frecuencia.</p>
   <p><b>Trimedia</b> — promedio ponderado de los tres cuartiles, con la mediana pesando doble:</p>
   <span class="f fbig">Trimedia = (Q₁ + 2Q₂ + Q₃) / 4</span>
   <p>Está en el formulario del examen. Es un compromiso: usa más información que la mediana sola, pero sigue siendo resistente porque solo depende de posiciones. Junto con la media recortada y la winsorizada, es una de las alternativas cuando la distribución es asimétrica.</p>
   <div class="nota"><b>Cómo elegir:</b> distribución simétrica → media, mediana y moda coinciden, usa la media. Distribución asimétrica o con atípicos → la media se desplaza hacia el extremo; usa la mediana.</div>`},
  {num:"2.2", t:"Propiedades ante transformaciones lineales", c:`
   <p>Si Y = a + b·X, las tres propiedades que se preguntan una y otra vez:</p>
   <div class="scroll"><table>
    <tr><th></th><th>Sumar constante (Y = X + k)</th><th>Multiplicar (Y = k·X)</th><th>Lineal (Y = a + bX)</th></tr>
    <tr><td>Media</td><td class="n">ȳ = x̄ + k</td><td class="n">ȳ = k · x̄</td><td class="n">ȳ = a + b·x̄</td></tr>
    <tr><td>Varianza</td><td class="n">S²<sub>y</sub> = S²<sub>x</sub></td><td class="n">S²<sub>y</sub> = k² · S²<sub>x</sub></td><td class="n">S²<sub>y</sub> = b² · S²<sub>x</sub></td></tr>
    <tr><td>Desv. típica</td><td class="n">S<sub>y</sub> = S<sub>x</sub></td><td class="n">S<sub>y</sub> = |k| · S<sub>x</sub></td><td class="n">S<sub>y</sub> = |b| · S<sub>x</sub></td></tr>
   </table></div>
   <div class="nota"><b>La idea de fondo:</b> sumar una constante <i>desplaza</i> la distribución entera pero no la estira, así que la dispersión no cambia. Multiplicar sí la estira, y la varianza lo hace al cuadrado.</div>`},
  {num:"2.2", t:"Dispersión", c:`
   <ul>
    <li><b>Amplitud total</b> <span class="f">AT = máx − mín</span> muy sensible a atípicos.</li>
    <li><b>Amplitud intercuartil</b> <span class="f">AIQ = Q₃ − Q₁</span> longitud del intervalo que contiene el 50 % central. Robusta.</li>
    <li><b>Desviación cuartil</b> <span class="f">DC = (Q₃ − Q₁) / 2</span> la mitad de la AIQ. También robusta.</li>
    <li><b>Varianza</b> <span class="f">S²<sub>x</sub> = Σ(X<sub>i</sub> − m)² / (n − 1)</span> siempre ≥ 0; vale 0 solo si todos los valores son iguales (constante).</li>
    <li><b>Desviación típica</b> <span class="f">S<sub>x</sub> = √S²<sub>x</sub></span> preferible a la varianza porque se expresa en las unidades originales.</li>
    <li><b>Coeficiente de variación</b> <span class="f">CV = S<sub>x</sub> / |m| · 100</span> dispersión relativa.</li>
    <li><b>Coeficiente de variación cuartil</b> <span class="f">CVC = (Q₃ − Q₁) / (Q₃ + Q₁)</span> la versión robusta del CV: dispersión relativa basada en cuartiles.</li>
   </ul>
   <div class="nota alerta"><b>n o n−1:</b> el <b>formulario oficial del examen</b> define la varianza dividiendo entre <b>n−1</b>, y esa es la versión que debes usar el 11 de diciembre. Algunas diapositivas la presentan dividida entre n. Si el enunciado no dice nada, aplica la del formulario. En Excel: <code>VAR.S</code> y <code>DESVEST.M</code> usan n−1; <code>VAR.P</code> y <code>DESVEST.P</code> usan n.</div>
   <div class="nota"><b>Para qué sirve el CV:</b> la varianza solo compara variables medidas en las mismas unidades. Si un grupo puntúa en atención (Var = 40) y otro en percepción (Var = 10), no puedes decir cuál es más homogéneo. El CV sí lo permite, porque es adimensional. Orientativo: por encima de 50 hay mucha heterogeneidad. Va en valor absoluto de la media porque con medias negativas el signo no debe alterar la lectura.</div>`},
  {num:"2.2", t:"Forma: asimetría y curtosis", c:`
   <ul>
    <li><b>Asimetría positiva</b> — mayor concentración en la parte baja, cola hacia la derecha. La media queda por encima de la mediana.</li>
    <li><b>Asimetría negativa</b> — mayor concentración en la parte alta, cola hacia la izquierda. La media queda por debajo de la mediana.</li>
    <li><b>Curtosis</b> — grado de apuntamiento: alta concentración alrededor de los valores centrales (leptocúrtica) o baja (platicúrtica). La normal es mesocúrtica.</li>
   </ul>
   <div class="nota alerta"><b>Qué índice usar:</b> los índices basados en <b>momentos</b> (media, varianza, DT) no son resistentes y desaconsejan usarse con asimetría o atípicos. Los basados en <b>ordenación</b> (mediana, cuartiles, percentiles) son resistentes pero solo usan la posición, no el valor. Recomendación del tema: dar siempre un índice de amplitud y otro de desviación.</div>`},
  {num:"2.3", t:"Gráficos cuantitativos", c:`
   <ul>
    <li><b>Histograma</b> — datos continuos agrupados en intervalos de la misma amplitud: en X los intervalos, en Y las frecuencias.</li>
    <li><b>Tallo y hojas</b> — ordena sin agrupar: <i>conserva los valores originales</i>, localiza el centro, muestra saltos y detecta atípicos.</li>
    <li><b>Caja y bigotes</b> — se construye sobre los cuartiles: la caja va de Q₁ a Q₃ con la mediana dentro, y los bigotes llegan al máximo y mínimo no atípicos.</li>
   </ul>`}
 ],

TEMAS.push(
{
 id:"T3", n:3, tit:"Fundamentos de probabilidad", sub:"Sucesos, reglas y la lógica del contraste",
 secs:[
  {num:"3.1", t:"Por qué la probabilidad sostiene la inferencia", c:`
   <p>La probabilidad es el sistema en el que se apoya la estadística para pasar de los datos de una muestra a conclusiones sobre la población. Se obtienen muestras al azar, se calculan índices que siguen una <b>distribución de probabilidad conocida</b> y eso permite tomar decisiones.</p>
   <ul>
    <li><b>Leyes deterministas</b> — repetir el experimento en las mismas condiciones da siempre el mismo resultado. Ciencias formales. <i>Dos átomos de H y uno de O forman agua.</i></li>
    <li><b>Leyes probabilísticas</b> — repetirlo puede dar resultados distintos. Ciencias naturales y sociales, psicología incluida. <i>Quien puntúa alto en psicoticismo tiene mayor probabilidad de cometer un delito.</i></li>
   </ul>
   <p>Dos rasgos lo explican: <b>aleatoriedad</b> (los resultados dependen del azar) y <b>variabilidad</b> (los fenómenos estudiados varían).</p>`},
  {num:"3.2", t:"Experimento aleatorio, espacio muestral y suceso", c:`
   <p><b>Experimento aleatorio (EA)</b>: acción cuyo resultado no puede predecirse. Debe estar bien delimitado, poder repetirse en las mismas condiciones y dar un resultado en cada ensayo.</p>
   <p><b>Espacio muestral (E)</b>: conjunto de todos los resultados posibles. Al lanzar un dado, E = {1, 2, 3, 4, 5, 6}.</p>
   <p><b>Suceso</b>: cada uno de los resultados posibles. Tipos:</p>
   <ul>
    <li><b>Simple o elemental</b> — un solo elemento de E. <i>Obtener cruz-cruz en dos lanzamientos.</i></li>
    <li><b>Compuesto</b> — más de un resultado. <i>«Al menos una cruz» = {CC, CX, XC}.</i></li>
    <li><b>Complementario</b> — todos los resultados de E que no forman parte del suceso.</li>
    <li><b>Seguro</b> — todo el espacio muestral. <i>Sacar un número entre 1 y 6 con un dado.</i></li>
    <li><b>Imposible</b> — el conjunto vacío ∅. <i>Sacar un 7 con un dado de seis caras.</i></li>
   </ul>`},
  {num:"3.2", t:"Operaciones con sucesos", c:`
   <p>Con A = «número par» = {2, 4, 6} y B = «número ≥ 3» = {3, 4, 5, 6}:</p>
   <ul>
    <li><b>Unión (A ∪ B)</b> — se verifica si ocurre uno <b>u</b> otro. Tiene que ver con sumar. <span class="f">A ∪ B = {2, 3, 4, 5, 6}</span></li>
    <li><b>Intersección (A ∩ B)</b> — se verifica si ocurre un resultado que pertenece <b>a los dos</b>. Tiene que ver con multiplicar. <span class="f">A ∩ B = {4, 6}</span></li>
    <li><b>Diferencia (A − B)</b> — resultados del primero que no están en el segundo. <span class="f">A − B = {2}</span></li>
    <li><b>Incompatibles o mutuamente excluyentes</b> — su intersección es ∅. Dos sucesos elementales distintos siempre lo son.</li>
   </ul>
   <div class="nota alerta"><b>Trampa de examen:</b> A − B no es lo mismo que B − A. Con A = {1,2,3,4} y B = {3,4,5,6}: A − B = {1,2}, pero B − A = {5,6}.</div>`},
  {num:"3.2", t:"Cálculo de la probabilidad", c:`
   <span class="f fbig">P(A) = nº de casos favorables / nº de casos posibles</span>
   <ul>
    <li>La probabilidad de un suceso está siempre entre <b>0 y 1</b>.</li>
    <li>P(suceso imposible) = 0. P(suceso seguro) = 1.</li>
   </ul>
   <p><b>Ley de los grandes números</b>: al repetir el experimento muchas veces bajo las mismas condiciones, las frecuencias relativas se estabilizan en un valor, y ese valor es la probabilidad del suceso.</p>
   <div class="nota alerta"><b>Error clásico:</b> invertir la fracción. Favorables <i>arriba</i>, posibles <i>abajo</i>. Si sale un número mayor que 1, la has invertido.</div>`},
  {num:"3.2", t:"Regla de la suma y regla del producto", c:`
   <p><b>Suma (unión)</b>, y hay que mirar si los sucesos son excluyentes:</p>
   <span class="f">Excluyentes: P(A ∪ B) = P(A) + P(B)</span>
   <span class="f">No excluyentes: P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</span>
   <p><b>Producto (intersección)</b>, y hay que mirar si son independientes:</p>
   <span class="f">Independientes: P(A ∩ B) = P(A) · P(B)</span>
   <span class="f">Dependientes: P(A ∩ B) = P(A) · P(B|A)</span>`},
  {num:"3.2", t:"Probabilidad condicionada e independencia", c:`
   <span class="f fbig">P(A | B) = P(A ∩ B) / P(B)</span>
   <p>Se lee «probabilidad de A <b>dado que</b> ha ocurrido B». La ocurrencia de un suceso cambia la probabilidad del otro, y comparando ambas se decide si hay independencia.</p>
   <ul>
    <li><b>Independencia</b> — P(A|B) = P(A). Saber que ocurrió B no aporta nada. <i>P(tener gemelos | hay gatos en el vecindario) = 0,02, igual que la probabilidad general.</i></li>
    <li><b>Dependencia</b> — P(A|B) ≠ P(A). <i>P(tener gemelos | hay gemelos en mi familia) = 0,20, diez veces mayor.</i></li>
   </ul>`},
  {num:"3.3", t:"De la probabilidad al contraste de hipótesis", c:`
   <p>Aquí es donde la probabilidad conecta con el resto de la asignatura. Permite estimar si los resultados de una muestra son representativos de la población, y sobre ella se evalúan las hipótesis estadísticas:</p>
   <ul>
    <li><b>H₀, hipótesis nula</b> — lo que estudiamos <i>no</i> ocurre. Es la que se pone a prueba.</li>
    <li><b>H₁, hipótesis alternativa</b> — lo que estudiamos sí ocurre.</li>
   </ul>
   <p>La decisión depende del <b>nivel de significación</b>, que en psicología es α = 0,05:</p>
   <ul>
    <li>Si <b>p &lt; 0,05</b> → se <b>rechaza</b> H₀ y se acepta H₁.</li>
    <li>Si <b>p &gt; 0,05</b> → se <b>mantiene</b> H₀.</li>
   </ul>
   <div class="nota"><b>Matiz que cae en examen:</b> H₀ nunca «se acepta», <i>se mantiene o se conserva</i>. No demuestras que no hay efecto: solo que no tienes evidencia suficiente para afirmar que lo hay.</div>`}
 ],

{
 id:"T4", n:4, tit:"Relación entre variables", sub:"Covarianza, correlación, ji-cuadrado y comparación de grupos",
 secs:[
  {num:"4.1", t:"Asociación y causalidad", c:`
   <p>Que dos variables <b>covaríen</b> significa que los valores de una cambian en función de la otra. La asociación es <b>requisito</b> de la causalidad, pero no es suficiente. La causalidad exige tres cosas:</p>
   <ul>
    <li><b>Asociación estadísticamente significativa</b> — las dos variables covarían de modo evidente.</li>
    <li><b>Precedencia temporal</b> — la VI antecede a la VD.</li>
    <li><b>Ausencia de relación espuria</b> — ninguna tercera variable es la verdadera causa.</li>
   </ul>
   <p>Además, en ciencias sociales las relaciones causales son <b>probabilísticas</b> (una variable probablemente causa otra; se habla de predictora y resultado), mientras que en ciencias naturales tienden a ser <b>deterministas</b> (VI y VD en estudios experimentales).</p>
   <div class="nota alerta"><b>Relaciones espurias:</b> el consumo de queso en EE. UU. y el número de personas que mueren enredadas en las sábanas correlacionan a r = 0,94. Ambas suben con el tiempo y con la población: la tercera variable lo explica todo.</div>`},
  {num:"4.2", t:"Covarianza", c:`
   <span class="f fbig">S<sub>xy</sub> = Σ (X<sub>i</sub> − x̄)(Y<sub>i</sub> − ȳ) / n</span>
   <p>Es la variación cruzada de dos variables: suma de las puntuaciones diferenciales de X entrelazadas con las de Y.</p>
   <ul>
    <li><b>&lt; 0</b> relación inversa · <b>= 0</b> ausencia de relación · <b>&gt; 0</b> relación positiva.</li>
   </ul>
   <p>Sus tres limitaciones son la razón de que exista la correlación: <b>no está acotada</b> (va de −∞ a +∞), <b>depende de las unidades</b> de medida y por eso <b>es difícil de interpretar</b> y no permite comparar.</p>
   <div class="nota alerta"><b>Cuidado con el divisor:</b> el formulario del examen escribe la covarianza con <b>n</b> y la varianza con <b>n−1</b>. Para calcular r hay que usar <b>el mismo divisor en los tres términos</b>, porque si mezclas, el resultado deja de ser la correlación de Pearson. Con los datos del caso resuelto de este tema: todo con n−1 (o todo con n) da r = 0,72; mezclando covarianza/n con desviaciones/(n−1) saldría 0,64, que no significa nada.</div>`},
  {num:"4.2", t:"Correlación de Pearson", c:`
   <span class="f fbig">r<sub>xy</sub> = S<sub>xy</sub> / (S<sub>x</sub> · S<sub>y</sub>)</span>
   <p>Es la covarianza dividida por el producto de las desviaciones típicas: la covarianza estandarizada. Eso resuelve las tres limitaciones anteriores: está <b>acotada entre −1 y +1</b>, tiene <b>métrica estandarizada</b> y por tanto se interpreta y se compara con facilidad.</p>
   <p>Interpretación de la magnitud según el tema:</p>
   <div class="scroll"><table>
    <tr><th>|r|</th><th>Relación</th></tr>
    <tr><td class="n">hasta ±0,1</td><td>pequeña</td></tr>
    <tr><td class="n">hasta ±0,3</td><td>mediana</td></tr>
    <tr><td class="n">hasta ±0,5</td><td>alta</td></tr>
   </table></div>
   <p>Desde una <b>matriz de covarianzas</b>, la diagonal contiene las varianzas y el resto las covarianzas, así que r se obtiene dividiendo la covarianza entre las raíces de las dos varianzas correspondientes.</p>`},
  {num:"4.2", t:"Coeficiente de determinación", c:`
   <span class="f fbig">r² = (r<sub>xy</sub>)²</span>
   <p>Indica qué parte de la variabilidad de Y queda explicada por la de X: la <b>proporción de varianza compartida</b>. Va de 0 (X no explica nada de Y) a 1 (la explica al 100 %).</p>
   <div class="nota"><b>Lectura rápida:</b> con r = 0,60, r² = 0,36, es decir un 36 % de varianza explicada y un <b>64 % sin explicar</b>. Es la mejor vacuna contra sobreinterpretar una correlación «alta».</div>
   <div class="nota alerta"><b>Nunca:</b> de una correlación, por grande que sea, solo se puede concluir covariación. Causalidad, no.</div>`},
  {num:"4.3", t:"Dos variables categóricas: ji-cuadrado", c:`
   <p>Con categorías solo se puede describir el comportamiento de cada grupo y concluir si hay asociación. La herramienta es la <b>tabla de contingencia</b>, que cruza las frecuencias absolutas de las dos variables.</p>
   <span class="f fbig">e<sub>ij</sub> = (total fila × total columna) / n</span>
   <span class="f fbig">χ² = Σ (o<sub>ij</sub> − e<sub>ij</sub>)² / e<sub>ij</sub></span>
   <p>Donde o<sub>ij</sub> es la frecuencia observada y e<sub>ij</sub> la esperada si no hubiera relación. Va de 0 a +∞: vale 0 si observadas y esperadas coinciden, y crece con la asociación.</p>
   <p>Limitaciones: <b>no está acotado</b>, <b>depende del tamaño muestral</b> y <b>no informa de la intensidad</b>. Por eso se acompaña de:</p>
   <ul>
    <li><b>φ (phi)</b> <span class="f">φ = √(χ² / n)</span> solo para tablas <b>2×2</b>. Acotada, informa de la intensidad.</li>
    <li><b>V de Cramer</b> <span class="f">V = √(χ² / (n·(k−1)))</span> para tablas mayores, con <b>k</b> = número de categorías de la variable que <i>menos</i> tiene. De 0 a 1.</li>
   </ul>`},
  {num:"4.4", t:"Una cuantitativa y una categórica", c:`
   <p>Se compara cómo se comporta cada grupo de la variable categórica en la variable cuantitativa: valores de tendencia central (media, mediana), de posición (percentiles) y de dispersión (AIQ). Si hay diferencias entre los grupos, hay asociación entre las variables.</p>
   <ul>
    <li><b>Diagrama de caja múltiple</b> — compara la distribución completa grupo a grupo. Se fundamenta en los cuartiles.</li>
    <li><b>Diagrama de medias</b> — compara solo la media de cada grupo.</li>
   </ul>
   <div class="nota">Los contrastes estadísticos de estas diferencias (t, ANOVA) no entran en esta asignatura: aquí solo se describen y se interpretan los gráficos.</div>`}
 ],

{
 id:"T5", n:5, tit:"Estadística inferencial", sub:"Normal, distribución muestral, estimación y contraste",
 secs:[
  {num:"5.1", t:"Qué es inferir", c:`
   <p>Extraer conclusiones sobre la población a partir de una muestra representativa. Se hace por dos vías:</p>
   <ul>
    <li><b>Estimación</b> — de un estadístico muestral a un parámetro poblacional. Puede ser puntual o por intervalos.</li>
    <li><b>Prueba de hipótesis</b> — se parte de una afirmación sobre el parámetro y se mantiene o se rechaza según la evidencia muestral.</li>
   </ul>
   <p>La cadena va de lo general a lo accesible: población general → población objetivo → población accesible → muestra.</p>`},
  {num:"5.2", t:"Muestreo y representatividad", c:`
   <p>La representatividad depende de tres factores:</p>
   <ul>
    <li><b>Tipo de muestreo</b> — probabilístico (probabilidad conocida e igual para todos: mayor representatividad) frente a no probabilístico.</li>
    <li><b>Estructura de la muestra</b> — sus características deben parecerse a las de la población de referencia.</li>
    <li><b>Tamaño muestral</b> — n = 30 suele bastar, pero <b>no garantiza</b> representatividad. Una muestra grande y sesgada sigue siendo sesgada.</li>
   </ul>`},
  {num:"5.2.1", t:"La distribución normal y la tipificación", c:`
   <p>La campana de Gauss es <b>simétrica</b>, <b>mesocúrtica</b> y <b>asintótica</b> (sus colas tienden al infinito sin tocar el eje). Se define por dos parámetros: <span class="f">N(<span class="par">μ</span>, <span class="par">σ</span>)</span> y la normal unitaria es <span class="f">N(0, 1)</span>.</p>
   <p>Para comparar variables con distinta métrica, distinto centro o distinta dispersión se <b>tipifica</b>:</p>
   <span class="f fbig">z = (X − <span class="par">μ</span>) / <span class="par">σ</span></span>
   <p>La puntuación típica z coloca cualquier variable en la misma métrica: centro 0, dispersión 1, y las unidades son desviaciones típicas respecto a la media. Como conocemos la proporción de casos por cada DT, el valor se interpreta al instante.</p>
   <div class="scroll"><table>
    <tr><th>Intervalo</th><th>% de casos</th></tr>
    <tr><td class="n">μ ± 1σ</td><td class="n">≈ 68,3 %</td></tr>
    <tr><td class="n">μ ± 2σ</td><td class="n">≈ 95,4 %</td></tr>
    <tr><td class="n">μ ± 3σ</td><td class="n">≈ 99,7 %</td></tr>
   </table></div>
   <div class="nota"><b>Por qué importa:</b> una puntuación diferencial de −7 no se puede comparar con una z de 0,5, porque la primera está en las unidades originales y la segunda en unidades de DT. Solo lo tipificado es comparable.</div>`},
  {num:"5.2.2", t:"Distribución muestral de un estadístico", c:`
   <p>Es la distribución teórica que asigna una probabilidad a cada valor que puede tomar un estadístico en <b>todas las muestras del mismo tamaño</b> que se pueden extraer de una población.</p>
   <p>Ejemplo del tema: de una población con μ = 302 y σ = 250 se extraen muestras de n = 5 y salen medias de 333, 224, 357, 573… Cada una difiere del parámetro en un <b>error muestral</b> (31, −78, 55, 271). El conjunto de todas esas medias forma la distribución muestral.</p>
   <p>Si la variable se distribuye normalmente, la distribución muestral de la media también lo hace, con:</p>
   <span class="f">Valor esperado: μ<sub>x̄</sub> = μ</span><span class="f">Desviación típica: σ<sub>x̄</sub> = σ/√n</span>`},
  {num:"5.2.3", t:"Teorema Central del Límite", c:`
   <p>Sea cual sea la forma de la distribución de la variable original, la distribución muestral de la media <b>tiende a la normal</b> a medida que aumenta el tamaño de la muestra.</p>
   <div class="nota"><b>Por qué es la pieza clave:</b> muchas variables psicológicas se distribuyen normalmente, y las que no, gracias al TCL permiten aplicar igualmente la normal al estadístico. Sin TCL no habría ni intervalos de confianza ni contrastes.</div>`},
  {num:"5.3", t:"Estimación puntual y error estándar", c:`
   <p><b>Estimación puntual</b>: un único valor muestral estima el parámetro. Un buen estimador debe ser:</p>
   <ul>
    <li><b>Insesgado</b> — el promedio de todas las muestras coincide con el parámetro.</li>
    <li><b>Eficiente</b> — varianza mínima entre todas las muestras: estimación más precisa.</li>
    <li><b>Consistente</b> — al aumentar n, el estadístico se acerca al parámetro.</li>
    <li><b>Suficiente</b> — usa toda la información disponible de la muestra.</li>
   </ul>
   <span class="f fbig">EE = <span class="par">σ</span> / √n</span>
   <p>El <b>error estándar o máximo</b> es la variabilidad de la distribución muestral: la diferencia máxima que cabe esperar, con cierta probabilidad, entre el parámetro y el estadístico. <b>A mayor n, menor EE y mayor precisión</b>, pero la relación es con la raíz: para reducirlo a la mitad hay que cuadruplicar la muestra.</p>`},
  {num:"5.3.2", t:"Intervalos de confianza", c:`
   <p>El problema de la estimación puntual es que cada muestra da un valor distinto y es difícil que coincida con el parámetro. Solución: dar un <b>rango</b>.</p>
   <span class="f fbig">IC = estadístico ± (valor crítico × EE)</span>
   <ul>
    <li><b>Nivel de confianza (1−α)</b> — probabilidad de que el IC contenga el parámetro.</li>

   <p>Método de decisión que permite mantener o rechazar una proposición estadística sobre la población.</p>
   <div class="scroll"><table>
    <tr><th></th><th>H₀ nula</th><th>H₁ alternativa</th></tr>
    <tr><td>Papel</td><td>Se somete a contraste</td><td>Negación de la nula</td></tr>
    <tr><td>Forma</td><td>Exacta: =, ≥, ≤</td><td>Inexacta: ≠, &gt;, &lt;</td></tr>

   </table></div>
   <p>Son mutuamente excluyentes y exhaustivas. Tres tipos de contraste: <b>bilateral</b> (no sabemos la dirección), <b>unilateral derecho</b> (esperamos un valor superior) y <b>unilateral izquierdo</b> (inferior).</p>

   <p>Zona crítica bilateral: Z ≤ z<sub>α/2</sub> o Z ≥ z<sub>1−α/2</sub> (con α = 0,05, ±1,96). Unilateral derecho: Z ≥ z<sub>1−α</sub>. Unilateral izquierdo: Z ≤ z<sub>α</sub>.</p>
   <p><b>Vía 2 · intervalos de confianza.</b> Si el IC contiene el valor de H₀, se mantiene H₀; si no lo contiene, se rechaza. Un IC puede verse como el conjunto de hipótesis aceptables.</p>`},

    <tr><td>Rechazar H₀</td><td class="n">Error tipo I · α · falso positivo</td><td>Acierto: potencia (1−β)</td></tr>
