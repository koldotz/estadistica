{
 id:"T4", n:4, tit:"Relación entre variables", sub:"Covarianza, correlación, ji-cuadrado y comparación de grupos",
 secs:[
  {num:"4.1", t:"Asociación y causalidad", c:`
   <p>Que dos variables <b>covaríen</b> significa que los valores de una cambian en función de la otra. La asociación es <b>requisito</b> de la causalidad, pero no es suficiente. La causalidad exige tres cosas:</p>
   <ul>
    <li><b>Asociación estadísticamente significativa</b> — las dos variables covarían de modo evidente.</li>
    <li><b>Precedencia temporal</b> — la VI antecede a la VD.</li>
    <li><b>Ausencia de relación espuria</b> — ninguna tercera variable es la verdadera causa.</li>
   </ul>
   <p>Además, en ciencias sociales las relaciones causales son <b>probabilísticas</b> (una variable probablemente causa otra; se habla de predictora y resultado), mientras que en ciencias naturales tienden a ser <b>deterministas</b> (VI y VD en estudios experimentales).</p>
   <div class="nota alerta"><b>Relaciones espurias:</b> el consumo de queso en EE. UU. y el número de personas que mueren enredadas en las sábanas correlacionan a r = 0,94. Ambas suben con el tiempo y con la población: la tercera variable lo explica todo.</div>`},
  {num:"4.2", t:"Covarianza", c:`
   <span class="f fbig">S<sub>xy</sub> = Σ (X<sub>i</sub> − x̄)(Y<sub>i</sub> − ȳ) / n</span>
   <p>Es la variación cruzada de dos variables: suma de las puntuaciones diferenciales de X entrelazadas con las de Y.</p>
   <ul>
    <li><b>&lt; 0</b> relación inversa · <b>= 0</b> ausencia de relación · <b>&gt; 0</b> relación positiva.</li>
   </ul>
   <p>Sus tres limitaciones son la razón de que exista la correlación: <b>no está acotada</b> (va de −∞ a +∞), <b>depende de las unidades</b> de medida y por eso <b>es difícil de interpretar</b> y no permite comparar.</p>
   <div class="nota alerta"><b>Cuidado con el divisor:</b> el formulario del examen escribe la covarianza con <b>n</b> y la varianza con <b>n−1</b>. Para calcular r hay que usar <b>el mismo divisor en los tres términos</b>, porque si mezclas, el resultado deja de ser la correlación de Pearson. Con los datos del caso resuelto de este tema: todo con n−1 (o todo con n) da r = 0,72; mezclando covarianza/n con desviaciones/(n−1) saldría 0,64, que no significa nada.</div>`},
  {num:"4.2", t:"Correlación de Pearson", c:`
   <span class="f fbig">r<sub>xy</sub> = S<sub>xy</sub> / (S<sub>x</sub> · S<sub>y</sub>)</span>
   <p>Es la covarianza dividida por el producto de las desviaciones típicas: la covarianza estandarizada. Eso resuelve las tres limitaciones anteriores: está <b>acotada entre −1 y +1</b>, tiene <b>métrica estandarizada</b> y por tanto se interpreta y se compara con facilidad.</p>
   <p>Interpretación de la magnitud según el tema:</p>
   <div class="scroll"><table>
    <tr><th>|r|</th><th>Relación</th></tr>
    <tr><td class="n">hasta ±0,1</td><td>pequeña</td></tr>
    <tr><td class="n">hasta ±0,3</td><td>mediana</td></tr>
    <tr><td class="n">hasta ±0,5</td><td>alta</td></tr>
   </table></div>
   <p>Desde una <b>matriz de covarianzas</b>, la diagonal contiene las varianzas y el resto las covarianzas, así que r se obtiene dividiendo la covarianza entre las raíces de las dos varianzas correspondientes.</p>`},
  {num:"4.2", t:"Coeficiente de determinación", c:`
   <span class="f fbig">r² = (r<sub>xy</sub>)²</span>
   <p>Indica qué parte de la variabilidad de Y queda explicada por la de X: la <b>proporción de varianza compartida</b>. Va de 0 (X no explica nada de Y) a 1 (la explica al 100 %).</p>
   <div class="nota"><b>Lectura rápida:</b> con r = 0,60, r² = 0,36, es decir un 36 % de varianza explicada y un <b>64 % sin explicar</b>. Es la mejor vacuna contra sobreinterpretar una correlación «alta».</div>
   <div class="nota alerta"><b>Nunca:</b> de una correlación, por grande que sea, solo se puede concluir covariación. Causalidad, no.</div>`},
  {num:"4.3", t:"Dos variables categóricas: ji-cuadrado", c:`
   <p>Con categorías solo se puede describir el comportamiento de cada grupo y concluir si hay asociación. La herramienta es la <b>tabla de contingencia</b>, que cruza las frecuencias absolutas de las dos variables.</p>
   <span class="f fbig">e<sub>ij</sub> = (total fila × total columna) / n</span>
   <span class="f fbig">χ² = Σ (o<sub>ij</sub> − e<sub>ij</sub>)² / e<sub>ij</sub></span>
   <p>Donde o<sub>ij</sub> es la frecuencia observada y e<sub>ij</sub> la esperada si no hubiera relación. Va de 0 a +∞: vale 0 si observadas y esperadas coinciden, y crece con la asociación.</p>
   <p>Limitaciones: <b>no está acotado</b>, <b>depende del tamaño muestral</b> y <b>no informa de la intensidad</b>. Por eso se acompaña de:</p>
   <ul>
    <li><b>φ (phi)</b> <span class="f">φ = √(χ² / n)</span> solo para tablas <b>2×2</b>. Acotada, informa de la intensidad.</li>
    <li><b>V de Cramer</b> <span class="f">V = √(χ² / (n·(k−1)))</span> para tablas mayores, con <b>k</b> = número de categorías de la variable que <i>menos</i> tiene. De 0 a 1.</li>
   </ul>`},
  {num:"4.4", t:"Una cuantitativa y una categórica", c:`
   <p>Se compara cómo se comporta cada grupo de la variable categórica en la variable cuantitativa: valores de tendencia central (media, mediana), de posición (percentiles) y de dispersión (AIQ). Si hay diferencias entre los grupos, hay asociación entre las variables.</p>
   <ul>
    <li><b>Diagrama de caja múltiple</b> — compara la distribución completa grupo a grupo. Se fundamenta en los cuartiles.</li>
    <li><b>Diagrama de medias</b> — compara solo la media de cada grupo.</li>
   </ul>
   <div class="nota">Los contrastes estadísticos de estas diferencias (t, ANOVA) no entran en esta asignatura: aquí solo se describen y se interpretan los gráficos.</div>`}
 ],

{
 id:"T5", n:5, tit:"Estadística inferencial", sub:"Normal, distribución muestral, estimación y contraste",
 secs:[
  {num:"5.1", t:"Qué es inferir", c:`
   <p>Extraer conclusiones sobre la población a partir de una muestra representativa. Se hace por dos vías:</p>
   <ul>
    <li><b>Estimación</b> — de un estadístico muestral a un parámetro poblacional. Puede ser puntual o por intervalos.</li>
    <li><b>Prueba de hipótesis</b> — se parte de una afirmación sobre el parámetro y se mantiene o se rechaza según la evidencia muestral.</li>
   </ul>
   <p>La cadena va de lo general a lo accesible: población general → población objetivo → población accesible → muestra.</p>`},
  {num:"5.2", t:"Muestreo y representatividad", c:`
   <p>La representatividad depende de tres factores:</p>
   <ul>
    <li><b>Tipo de muestreo</b> — probabilístico (probabilidad conocida e igual para todos: mayor representatividad) frente a no probabilístico.</li>
    <li><b>Estructura de la muestra</b> — sus características deben parecerse a las de la población de referencia.</li>
    <li><b>Tamaño muestral</b> — n = 30 suele bastar, pero <b>no garantiza</b> representatividad. Una muestra grande y sesgada sigue siendo sesgada.</li>
   </ul>`},
  {num:"5.2.1", t:"La distribución normal y la tipificación", c:`
   <p>La campana de Gauss es <b>simétrica</b>, <b>mesocúrtica</b> y <b>asintótica</b> (sus colas tienden al infinito sin tocar el eje). Se define por dos parámetros: <span class="f">N(<span class="par">μ</span>, <span class="par">σ</span>)</span> y la normal unitaria es <span class="f">N(0, 1)</span>.</p>
   <p>Para comparar variables con distinta métrica, distinto centro o distinta dispersión se <b>tipifica</b>:</p>
   <span class="f fbig">z = (X − <span class="par">μ</span>) / <span class="par">σ</span></span>
   <p>La puntuación típica z coloca cualquier variable en la misma métrica: centro 0, dispersión 1, y las unidades son desviaciones típicas respecto a la media. Como conocemos la proporción de casos por cada DT, el valor se interpreta al instante.</p>
   <div class="scroll"><table>
    <tr><th>Intervalo</th><th>% de casos</th></tr>
    <tr><td class="n">μ ± 1σ</td><td class="n">≈ 68,3 %</td></tr>
    <tr><td class="n">μ ± 2σ</td><td class="n">≈ 95,4 %</td></tr>
    <tr><td class="n">μ ± 3σ</td><td class="n">≈ 99,7 %</td></tr>
   </table></div>
   <div class="nota"><b>Por qué importa:</b> una puntuación diferencial de −7 no se puede comparar con una z de 0,5, porque la primera está en las unidades originales y la segunda en unidades de DT. Solo lo tipificado es comparable.</div>`},
  {num:"5.2.2", t:"Distribución muestral de un estadístico", c:`
   <p>Es la distribución teórica que asigna una probabilidad a cada valor que puede tomar un estadístico en <b>todas las muestras del mismo tamaño</b> que se pueden extraer de una población.</p>
   <p>Ejemplo del tema: de una población con μ = 302 y σ = 250 se extraen muestras de n = 5 y salen medias de 333, 224, 357, 573… Cada una difiere del parámetro en un <b>error muestral</b> (31, −78, 55, 271). El conjunto de todas esas medias forma la distribución muestral.</p>
   <p>Si la variable se distribuye normalmente, la distribución muestral de la media también lo hace, con:</p>
   <span class="f">Valor esperado: μ<sub>x̄</sub> = μ</span><span class="f">Desviación típica: σ<sub>x̄</sub> = σ/√n</span>`},
  {num:"5.2.3", t:"Teorema Central del Límite", c:`
   <p>Sea cual sea la forma de la distribución de la variable original, la distribución muestral de la media <b>tiende a la normal</b> a medida que aumenta el tamaño de la muestra.</p>
   <div class="nota"><b>Por qué es la pieza clave:</b> muchas variables psicológicas se distribuyen normalmente, y las que no, gracias al TCL permiten aplicar igualmente la normal al estadístico. Sin TCL no habría ni intervalos de confianza ni contrastes.</div>`},
  {num:"5.3", t:"Estimación puntual y error estándar", c:`
   <p><b>Estimación puntual</b>: un único valor muestral estima el parámetro. Un buen estimador debe ser:</p>
   <ul>
    <li><b>Insesgado</b> — el promedio de todas las muestras coincide con el parámetro.</li>
    <li><b>Eficiente</b> — varianza mínima entre todas las muestras: estimación más precisa.</li>
    <li><b>Consistente</b> — al aumentar n, el estadístico se acerca al parámetro.</li>
    <li><b>Suficiente</b> — usa toda la información disponible de la muestra.</li>
   </ul>
   <span class="f fbig">EE = <span class="par">σ</span> / √n</span>
   <p>El <b>error estándar o máximo</b> es la variabilidad de la distribución muestral: la diferencia máxima que cabe esperar, con cierta probabilidad, entre el parámetro y el estadístico. <b>A mayor n, menor EE y mayor precisión</b>, pero la relación es con la raíz: para reducirlo a la mitad hay que cuadruplicar la muestra.</p>`},
  {num:"5.3.2", t:"Intervalos de confianza", c:`
   <p>El problema de la estimación puntual es que cada muestra da un valor distinto y es difícil que coincida con el parámetro. Solución: dar un <b>rango</b>.</p>
   <span class="f fbig">IC = estadístico ± (valor crítico × EE)</span>
   <ul>
    <li><b>Nivel de confianza (1−α)</b> — probabilidad de que el IC contenga el parámetro.</li>

   <p>Método de decisión que permite mantener o rechazar una proposición estadística sobre la población.</p>
   <div class="scroll"><table>
    <tr><th></th><th>H₀ nula</th><th>H₁ alternativa</th></tr>
    <tr><td>Papel</td><td>Se somete a contraste</td><td>Negación de la nula</td></tr>
    <tr><td>Forma</td><td>Exacta: =, ≥, ≤</td><td>Inexacta: ≠, &gt;, &lt;</td></tr>

   </table></div>
   <p>Son mutuamente excluyentes y exhaustivas. Tres tipos de contraste: <b>bilateral</b> (no sabemos la dirección), <b>unilateral derecho</b> (esperamos un valor superior) y <b>unilateral izquierdo</b> (inferior).</p>

   <p>Zona crítica bilateral: Z ≤ z<sub>α/2</sub> o Z ≥ z<sub>1−α/2</sub> (con α = 0,05, ±1,96). Unilateral derecho: Z ≥ z<sub>1−α</sub>. Unilateral izquierdo: Z ≤ z<sub>α</sub>.</p>
   <p><b>Vía 2 · intervalos de confianza.</b> Si el IC contiene el valor de H₀, se mantiene H₀; si no lo contiene, se rechaza. Un IC puede verse como el conjunto de hipótesis aceptables.</p>`},

    <tr><td>Rechazar H₀</td><td class="n">Error tipo I · α · falso positivo</td><td>Acierto: potencia (1−β)</td></tr>

 sol:"Son conceptos distintos que se confunden porque ambos suenan a «no tienen que ver». <b>Incompatibles</b> (o mutuamente excluyentes) significa que no pueden ocurrir a la vez: A ∩ B = ∅, y por tanto P(A∩B) = 0. Afecta a la <b>regla de la suma</b>: si son incompatibles, P(A∪B) = P(A) + P(B). <b>Independientes</b> significa que la ocurrencia de uno no cambia la probabilidad del otro: P(A|B) = P(A), y por tanto P(A∩B) = P(A)·P(B). Afecta a la <b>regla del producto</b>. De hecho, dos sucesos con probabilidad no nula que son incompatibles son necesariamente <b>dependientes</b>: si sé que ha ocurrido A, la probabilidad de B pasa a ser 0, que es un cambio máximo."},
{tm:"T3",k:"d",q:"¿Qué significa exactamente «mantener H₀»? ¿Por qué no se dice «aceptar H₀»?",
 sol:"Mantener H₀ significa que la evidencia de la muestra no es suficiente para descartarla: la diferencia observada entre el valor muestral y el poblacional puede explicarse razonablemente por el azar del muestreo. No se dice «aceptar» porque el contraste no está diseñado para <b>demostrar</b> que no hay efecto, sino para intentar refutar H₀; si no lo consigue, H₀ sigue en pie por defecto, igual que una hipótesis no falsada. Además, no rechazar puede deberse simplemente a falta de potencia: una muestra pequeña puede fallar en detectar un efecto real, lo que sería un error tipo II. Por eso la conclusión correcta es «no hay evidencia suficiente para afirmar que hay efecto», no «se ha probado que no lo hay»."},

/* ---------- T4 ---------- */
{tm:"T4",k:"vf",q:"La asociación entre dos variables es condición necesaria pero no suficiente para la causalidad.",ok:true,
 why:"Verdadero. Además hacen falta precedencia temporal y ausencia de relación espuria."},
{tm:"T4",k:"vf",q:"La covarianza está acotada entre −1 y +1.",ok:false,
 why:"Falso. La acotada es la correlación de Pearson. La covarianza va de −∞ a +∞ y depende de las unidades de medida."},
{tm:"T4",k:"vf",q:"El coeficiente de determinación puede tomar valores negativos.",ok:false,
 why:"Falso. r² es un cuadrado: va de 0 a 1. Quien lleva el signo, y por tanto la dirección, es r."},
{tm:"T4",k:"vf",q:"Phi se emplea cuando la tabla de contingencia es 2×2.",ok:true,
 why:"Verdadero. Para tablas mayores se usa la V de Cramer."},
{tm:"T4",k:"vf",q:"El ji-cuadrado informa de la intensidad de la asociación.",ok:false,
 why:"Falso, y es una de sus tres limitaciones: no está acotado, depende del tamaño muestral y no mide intensidad. Para eso están φ y V de Cramer."},
{tm:"T4",k:"t",q:"La covarianza entre dos variables vale −4,3. Eso indica…",
 op:["Relación inversa","Relación débil","Ausencia de relación"],ans:0,
 why:["Correcto: en la covarianza el signo informa de la dirección, y el negativo es relación inversa.","La magnitud de la covarianza no es interpretable: depende de las unidades.","La ausencia de relación se corresponde con un valor de 0."]},
{tm:"T4",k:"t",q:"Si r = 0,50, el porcentaje de varianza que queda SIN explicar es…",
 op:["50 %","25 %","75 %"],ans:2,
 why:["Confundir r con el porcentaje explicado es el error más frecuente del tema.","El 25 % es la varianza explicada: r² = 0,25.","Correcto: r² = 0,25 explica el 25 %, luego queda un 75 % sin explicar."]},
{tm:"T4",k:"t",q:"En una tabla de contingencia de 4×3, la intensidad de la asociación se mide con…",
 op:["Phi","V de Cramer","r de Pearson"],ans:1,
 why:["Phi solo vale para tablas 2×2.","Correcto, con k = 3, que es el número de categorías de la variable que menos tiene.","Pearson es para dos variables cuantitativas."]},
{tm:"T4",k:"t",q:"Una frecuencia esperada de una casilla se calcula como…",
 op:["Total de la fila × total de la columna / n","Frecuencia observada / n","n / número de casillas"],ans:0,
 why:["Correcto: es la frecuencia que habría en esa casilla si las variables fueran independientes.","Eso daría una proporción, no una frecuencia esperada.","Solo coincidiría en el caso particular de marginales perfectamente iguales."]},
{tm:"T4",k:"t",q:"Que r sea alta permite concluir…",
 op:["Causalidad","Covariación","Precedencia temporal"],ans:1,
 why:["La correlación por sí sola nunca demuestra causalidad.","Correcto: solo se puede afirmar que las variables varían conjuntamente.","La precedencia temporal la establece el diseño, no el índice."]},
{tm:"T4",k:"d",q:"El consumo de queso en EE. UU. y las muertes por enredarse con las sábanas correlacionan a r = 0,94. Explica qué está ocurriendo.",
 sol:"Es una <b>relación espuria</b>: existe covariación estadística real, pero no relación causal entre ambas variables. Lo que la produce es una <b>tercera variable</b>, en este caso el paso del tiempo y el crecimiento poblacional: ambas series crecen año tras año por razones independientes, y al correlacionarlas esa tendencia común genera un valor altísimo. El caso ilustra que la asociación es solo el <b>primero</b> de los tres requisitos de la causalidad; faltan la precedencia temporal argumentada y, sobre todo, el descarte de terceras variables. También muestra por qué la magnitud de r no debe leerse sola: hace falta una teoría previa que haga plausible el vínculo y, a ser posible, un diseño experimental con asignación aleatoria que controle las variables contaminadoras."},
{tm:"T4",k:"d",q:"¿Por qué el ji-cuadrado necesita acompañarse de phi o de V de Cramer?",
 sol:"χ² responde a una sola pregunta: si las frecuencias observadas se apartan de las que cabría esperar bajo independencia. Pero tiene tres limitaciones que lo hacen insuficiente como descripción. Primera, <b>no está acotado</b>: va de 0 a +∞, de modo que un valor de 222 no se puede situar en ninguna escala interpretable. Segunda, <b>depende del tamaño muestral</b>: con n muy grande, diferencias triviales producen χ² grandes. Tercera, y consecuencia de las anteriores, <b>no informa de la intensidad</b> de la asociación. φ y V de Cramer resuelven esto dividiendo χ² por n (y por k−1 en el caso de V), lo que produce índices acotados que se interpretan de forma parecida a una correlación. La práctica correcta es dar los dos: χ² para decidir si hay asociación y φ o V para decir cuánta."},

/* ---------- T5 ---------- */
{tm:"T5",k:"vf",q:"Un estadístico deseable es consistente, eficiente, suficiente y sesgado.",ok:false,
 why:"Falso por una sola palabra: debe ser INsesgado, es decir, que el promedio de todas las muestras coincida con el parámetro."},
{tm:"T5",k:"vf",q:"A mayor tamaño muestral, menor error de estimación y mayor precisión.",ok:true,
 why:"Verdadero. EE = σ/√n: al crecer n el error estándar baja y el intervalo se estrecha."},
{tm:"T5",k:"vf",q:"Los muestreos no probabilísticos aseguran muestras representativas.",ok:false,
 why:"Falso. Al no tener todos los elementos la misma probabilidad de ser elegidos, la representatividad es menor y desconocida."},
{tm:"T5",k:"vf",q:"Cuando la media muestral es igual a la media poblacional, el valor z es 0.",ok:true,
 why:"Verdadero. z = (x̄ − μ)/EE; si el numerador es 0, z es 0."},
{tm:"T5",k:"vf",q:"Con α = 0,01, la zona de rechazo total es mayor en un contraste bilateral que en uno unilateral derecho.",ok:false,
 why:"Falso. El área total de rechazo es α = 0,01 en ambos casos; lo que cambia es cómo se reparte: 0,005 en cada cola frente a 0,01 en una sola."},
{tm:"T5",k:"t",q:"El error estándar de la media es…",
 op:["σ","σ/√n","σ²/n"],ans:1,
 why:["σ es la dispersión de la variable, no la de la distribución muestral.","Correcto: la dispersión de las medias muestrales es menor que la de los datos, y decrece con √n.","Eso es la varianza de la distribución muestral, no su desviación típica."]},
{tm:"T5",k:"t",q:"Si el tamaño muestral pasa de 100 a 400, el error estándar…",
 op:["Se divide entre 2","Se divide entre 4","No cambia"],ans:0,
 why:["Correcto: interviene √n, y √400/√100 = 2. Cuadruplicar la muestra solo reduce el error a la mitad.","Sería así si el EE dependiera de n y no de su raíz.","Sí cambia: es la razón principal para aumentar la muestra."]},
{tm:"T5",k:"t",q:"Con α = 0,01 y contraste bilateral, los valores críticos de z son aproximadamente…",
 op:["±1,96","±2,58","±1,645"],ans:1,
 why:["±1,96 corresponde a α = 0,05 bilateral.","Correcto: con 0,005 en cada cola el valor crítico se aleja hasta ±2,58.","±1,645 es el unilateral con α = 0,05."]},
{tm:"T5",k:"t",q:"Rechazar H₀ cuando en realidad es verdadera es…",
 op:["Error tipo II","Error tipo I","La potencia del contraste"],ans:1,
 why:["El tipo II es el contrario: mantener H₀ siendo falsa, un falso negativo.","Correcto: es el falso positivo, y su probabilidad es α.","La potencia es 1−β: acertar rechazando cuando H₀ es falsa."]},
{tm:"T5",k:"t",q:"Se emplea la distribución t de Student cuando…",
 op:["La varianza poblacional es conocida","La varianza poblacional es desconocida","La muestra supera los 30 sujetos"],ans:1,
 why:["Con σ conocida se usa la normal y el valor crítico z.","Correcto: al estimar σ con S se añade incertidumbre, y la t la recoge con gl = n−1.","El tamaño influye en el parecido entre t y normal, pero no es el criterio de elección."]},
{tm:"T5",k:"d",q:"Explica el Teorema Central del Límite y por qué es la pieza que hace posible la inferencia.",
 sol:"El TCL establece que, <b>sea cual sea la forma de la distribución de la variable en la población</b>, la distribución muestral de la media tiende a la normal a medida que aumenta el tamaño de la muestra, con valor esperado μ y desviación típica σ/√n. Su importancia es instrumental: toda la inferencia de esta asignatura consiste en situar un estadístico dentro de una distribución de probabilidad <b>conocida</b> para calcular áreas, y la normal es la distribución cuyas áreas están tabuladas. Si dependiéramos de la forma real de cada variable psicológica, no podríamos hacer ni intervalos de confianza ni contrastes, porque no sabríamos qué probabilidad asignar a cada valor. El TCL garantiza que, aunque la variable original sea asimétrica, el estadístico se comporta de forma normal, y eso legitima usar z (o t si σ es desconocida) para decidir."},
{tm:"T5",k:"d",q:"Explica la diferencia entre significación estadística y relevancia práctica.",
 sol:"La <b>significación estadística</b> responde solo a si la diferencia observada entre el estadístico y el valor hipotetizado es mayor de lo esperable por el azar del muestreo: si p &lt; α, se rechaza H₀. La <b>relevancia práctica</b> se refiere a si esa diferencia tiene magnitud suficiente para importar en el contexto aplicado. Se disocian porque el estadístico de contraste incluye √n en el denominador del error estándar: <b>a mayor tamaño muestral, más fácil es rechazar H₀</b>, hasta el punto de que con muestras muy grandes casi cualquier diferencia, por trivial que sea, resulta significativa. Una mejora de 0,3 puntos en una escala de 100 puede ser estadísticamente significativa con n = 10.000 y clínicamente irrelevante. Por eso un resultado se valora con las dos cosas, y conviene acompañar el contraste de una estimación de la magnitud, como un intervalo de confianza."}
];

/* Ampliación de cada respuesta: explicación en profundidad + un segundo caso
   práctico. Se indexa por el texto de la pregunta y se muestra al corregir. */
const EJ_PLUS = {
"El proceso deductivo va de la teoría a los datos.": `<p>Deducción e inducción no son opuestos que se excluyan, sino las dos mitades del ciclo científico: se deduce una predicción concreta a partir de una teoría, se contrasta con datos y, con esos datos, se induce de vuelta hacia la teoría (confirmándola o corrigiéndola). La clave para el examen es fijarse en el <b>punto de partida</b>: si el enunciado arranca en una ley o teoría general, es deducción; si arranca en observaciones concretas, es inducción.</p><div class="ej2"><b>Otro ejemplo</b> «como la teoría del apego predice que los niños con apego seguro exploran más, esperamos que este niño explore más» parte de la teoría → deducción. «He observado que estos 30 niños seguros exploran más, así que quizá el apego favorezca la exploración» parte de los datos → inducción.</div>`,
"En la población, al contrario que en la muestra, los estadísticos son conocidos.": `<p>Es la confusión más frecuente del tema. La población se resume con <b>parámetros</b> (μ, σ, π): son constantes —un único valor fijo— pero desconocidos, porque rara vez podemos medir a toda la población. La muestra se resume con <b>estadísticos</b> (x̄, S<sub>x</sub>, P): son conocidos —los calculamos con nuestros datos— pero variables, porque cambian de una muestra a otra. Toda la inferencia consiste en usar lo conocido para estimar lo desconocido.</p><div class="ej2"><b>Otro ejemplo</b> una empresa quiere la altura media (μ) de sus 10.000 empleados. Medirlos a todos es caro, así que toma 100 y obtiene x̄ = 1,74 m. μ existe y es fijo, pero no lo conoce; x̄ = 1,74 sí lo conoce, y con otros 100 empleados saldría un x̄ algo distinto. Ese x̄ es su mejor estimación del μ desconocido.</div>`,
"Si medimos la ansiedad con «nada, poco, algo, mucho» tenemos una variable ordinal.": `<p>Las escalas forman una jerarquía de menos a más información: nominal (solo clasifica), ordinal (clasifica y ordena), de intervalo (además, distancias iguales) y de razón (además, cero absoluto). «Nada, poco, algo, mucho» ordena, pero el salto de «nada» a «poco» no tiene por qué medir lo mismo que de «algo» a «mucho»; por eso, en rigor, con una ordinal se usa la mediana, no la media.</p><div class="ej2"><b>Otro ejemplo</b> el puesto en una carrera (1.º, 2.º, 3.º) es ordinal: sabes el orden, pero no cuánto tiempo separa a cada corredor. Si anotas los segundos de cada uno, pasas a una escala de razón, donde sí puedes decir «llegó el doble de rápido».</div>`,
"La generalización de los resultados forma parte del nivel estadístico-analítico.": `<p>El proceso de investigación tiene tres niveles: <b>teórico-conceptual</b> (problema e hipótesis), <b>técnico-metodológico</b> (diseño, muestreo y recogida de datos) y <b>estadístico-analítico</b> (análisis, interpretación y generalización). La discusión y la generalización cierran el tercero, y desde ahí las conclusiones vuelven a alimentar la teoría: el proceso es cíclico, no lineal.</p><div class="ej2"><b>Otro ejemplo</b> «formular la hipótesis» pertenece al nivel teórico-conceptual; «elegir un muestreo aleatorio de 200 sujetos» al técnico-metodológico; «calcular el contraste y concluir que el efecto se generaliza a la población» al estadístico-analítico.</div>`,
"La validez interna aumenta cuando se controlan las variables extrañas.": `<p>La validez interna es la confianza en que fue la VI, y no otra cosa, la que causó el cambio en la VD. Las variables extrañas son explicaciones alternativas; cada una que se controla (manteniéndola constante, aleatorizando o usando grupo de control) cierra una vía por la que el efecto podría deberse a otra causa. Por eso los diseños experimentales, que controlan al máximo, tienen la mayor validez interna.</p><div class="ej2"><b>Otro ejemplo</b> para ver si un método de estudio mejora las notas, repartir a los alumnos al azar entre los dos métodos controla la VE «capacidad previa»: al azar, ambos grupos parten equilibrados y la diferencia final se puede atribuir al método.</div>`,
"Un psicólogo registra las interacciones de los niños en el recreo sin intervenir. ¿Qué método emplea?": `<p>Los tres métodos se ordenan por el <b>control</b> que ejercen: el experimental manipula la VI y asigna al azar (máximo control, mínima naturalidad); el selectivo o correlacional no manipula, solo agrupa por características ya existentes; el observacional se limita a registrar sin intervenir (mínimo control, máxima naturalidad). Registrar el recreo sin tocar nada es observacional puro.</p><div class="ej2"><b>Otro ejemplo</b> si el psicólogo <b>pusiera</b> música unos días sí y otros no para ver el efecto en las peleas, manipularía la VI: sería experimental. Si comparara a niños ya clasificados como «tímidos» y «extrovertidos», sería selectivo.</div>`,
"El número de accidentes laborales de un trabajador es una variable…": `<p>Una variable cuantitativa es <b>discreta</b> si solo toma valores aislados (normalmente enteros, por conteo) y <b>continua</b> si entre dos valores cualesquiera cabe cualquier otro (admite decimales). Los accidentes se cuentan: 0, 1, 2… no existe «2,7 accidentes». Que sea de razón (el 0 es ausencia real) no la hace continua.</p><div class="ej2"><b>Otro ejemplo</b> el número de hijos es discreto (2, 3…); el peso de una persona es continuo (68,4 kg tiene sentido). Ambos son de razón, pero se diferencian en si admiten decimales.</div>`,
"La validez externa es especialmente alta en…": `<p>La validez externa mide hasta qué punto los resultados se generalizan a otras personas (poblacional), lugares (ecológica) y momentos (temporal). Es alta cuando el estudio se hace en condiciones realistas y con muestras representativas, algo propio de los diseños observacionales. Su contrapartida es la interna: cuanto más artificial y controlado es el entorno, mejor se aísla la causa pero peor se generaliza.</p><div class="ej2"><b>Otro ejemplo</b> un experimento de memoria con sílabas sin sentido en un laboratorio tiene alta validez interna pero baja externa (nadie memoriza así en la vida real); observar cómo estudia la gente en su casa tiene el equilibrio opuesto.</div>`,
"En un estudio sobre el efecto del ruido en la concentración, el nivel de ruido es…": `<p>Conviene etiquetar los papeles: la <b>VI</b> es la causa que se manipula o selecciona; la <b>VD</b> es el efecto que se mide; las <b>VE</b> son terceras variables que podrían contaminar la relación. Aquí el ruido es lo que se varía (VI), la concentración lo que se mide (VD) y algo como la fatiga previa sería una VE.</p><div class="ej2"><b>Otro ejemplo</b> «¿mejora una terapia la ansiedad?»: la VI es recibir o no la terapia, la VD es el nivel de ansiedad medido después, y una VE sería que un grupo tuviera de partida más apoyo familiar que el otro.</div>`,
"¿Cuál de estas NO es una condición exigible a una hipótesis?": `<p>Las seis condiciones (consistencia, claridad, contraste empírico, poder explicativo, parsimonia y compatibilidad) son requisitos de <b>cómo se formula</b> una hipótesis, antes de tocar dato alguno. La significación estadística es un <b>resultado</b> que aparece al final, tras recoger datos y hacer el contraste; no puede exigirse por adelantado, porque aún no existe.</p><div class="ej2"><b>Otro ejemplo</b> «la música mejora el ánimo» es una buena hipótesis si es clara, falsable y parsimoniosa; que luego salga p = 0,03 (significativa) o p = 0,20 (no) es algo que solo se sabe después, y no depende de que estuviera bien formulada.</div>`,
"Explica la diferencia entre validez interna y externa y por qué tienden a moverse en sentidos opuestos.": `<p>La clave operativa es <b>control ↔ artificialidad</b>: el control que da validez interna se logra creando condiciones que no se dan en la vida real, y esa artificialidad resta generalización. No se pueden maximizar las dos a la vez; elegir método es decidir a cuál priorizar.</p><div class="ej2"><b>Otro ejemplo</b> un ensayo clínico con criterios de inclusión muy estrictos (solo pacientes sin otras enfermedades) tiene alta validez interna —el efecto del fármaco queda limpio— pero baja externa: sus resultados pueden no valer para el paciente típico, que suele tener varias dolencias a la vez.</div>`,
"Define parámetro y estadístico y señala tres diferencias entre ellos.": `<p>Regla para no fallar: los parámetros llevan letras <b>griegas</b> (μ, σ, π) y son fijos y desconocidos; los estadísticos llevan letras <b>latinas</b> (x̄, S<sub>x</sub>, P) y son conocidos pero cambian con cada muestra. La inferencia es el puente del segundo al primero.</p><div class="ej2"><b>Otro ejemplo</b> en unas elecciones, el porcentaje real de voto a un partido (π) es un parámetro fijo pero desconocido hasta el recuento; el de una encuesta a 1.000 personas (P) es un estadístico conocido que estima ese π y que variaría con otras 1.000 personas.</div>`,
"Los índices basados en momentos (media, varianza) son los más aconsejables ante distribuciones asimétricas y con casos atípicos.": `<p>Los índices basados en momentos (media, varianza, DT) se calculan sumando los valores, así que un solo caso extremo los arrastra: no son <b>resistentes</b>. Con asimetría o atípicos describen mal el centro y la dispersión, y hay que recurrir a los índices basados en la <b>ordenación</b> (mediana, cuartiles, amplitud intercuartil), que dependen de posiciones y no de magnitudes.</p><div class="ej2"><b>Otro ejemplo</b> en los sueldos de una empresa donde casi todos cobran 1.500 € y el dueño 200.000 €, la media da una cifra engañosamente alta; la mediana (1.500 €) describe mucho mejor lo que gana un empleado típico.</div>`,
"Si el percentil 40 vale 30, el valor 30 deja por debajo de sí el 40 % de los casos.": `<p>Un percentil P<sub>k</sub> es el valor que deja por debajo de sí el k % de los casos: es la definición literal, y de ahí cuelgan la mediana (P₅₀) y los cuartiles (P₂₅, P₇₅). Para localizarlo se calcula la posición j = k(n+1)/100 en la serie ordenada y, si es decimal, se interpola.</p><div class="ej2"><b>Otro ejemplo</b> si tu nota está en el P₉₀, has quedado por encima del 90 % de la gente; solo un 10 % te supera. No significa que hayas sacado un 90 sobre 100.</div>`,
"Las distribuciones con asimetría negativa presentan mayor concentración en la parte baja.": `<p>El signo de la asimetría lo marca la <b>cola</b>, no el grueso de los casos. Asimetría <b>negativa</b> = cola hacia la izquierda (valores bajos) y concentración en los valores altos; asimetría <b>positiva</b> = cola hacia la derecha y concentración en los bajos. En la negativa, la media queda por debajo de la mediana (la cola izquierda tira de ella).</p><div class="ej2"><b>Otro ejemplo</b> un examen muy fácil produce asimetría negativa: casi todos sacan notas altas (concentración arriba) y unos pocos suspenden formando la cola izquierda. Un examen muy difícil da la imagen contraria, asimetría positiva.</div>`,
"El diagrama de tallo y hojas permite detectar casos atípicos.": `<p>El diagrama de tallo y hojas coloca cada valor según sus dígitos, sin agruparlos en intervalos, así que conserva la información original. Eso permite ver a simple vista huecos, agrupamientos y valores que se despegan del resto, es decir, atípicos, algo que el histograma esconde al agrupar.</p><div class="ej2"><b>Otro ejemplo</b> con las edades 21, 22, 23, 24, 25, 68, el tallo «6 | 8» aparece aislado y lejos de la fila del tallo «2», delatando el 68 como atípico de un vistazo.</div>`,
"Entre Q1 y Q2 dejamos fuera el 25 % de los casos.": `<p>Los cuartiles parten la distribución ordenada en cuatro tramos del 25 % cada uno: por debajo de Q₁ hay un 25 %, entre Q₁ y Q₂ otro 25 %, entre Q₂ y Q₃ otro, y por encima de Q₃ el último. Por tanto, <b>entre</b> Q₁ y Q₂ está el 25 % de los casos, y <b>fuera</b> de ese tramo queda el 75 %.</p><div class="ej2"><b>Otro ejemplo</b> la amplitud intercuartil (Q₃ − Q₁) abarca el 50 % central: los dos tramos del medio, dejando fuera el 25 % más bajo y el 25 % más alto.</div>`,
"La amplitud intercuartil se calcula como…": `<p>La amplitud intercuartil, Q₃ − Q₁, recoge el recorrido del 50 % central y por eso es <b>robusta</b>: ignora el 25 % más extremo de cada lado, donde suelen estar los atípicos. La amplitud total (máx − mín) es su opuesta: la define un único valor extremo, así que es muy sensible.</p><div class="ej2"><b>Otro ejemplo</b> en 3, 4, 4, 5, 6, 7, 40, la amplitud total es 37 (dominada por el 40), mientras que la AIQ apenas se mueve porque el 40 queda fuera del tramo central: describe mejor la dispersión típica.</div>`,
"Si a todos los valores de una variable les sumamos 5, la desviación típica…": `<p>Ante una transformación lineal Y = a + bX, la dispersión solo depende del factor multiplicativo: S<sub>y</sub> = |b|·S<sub>x</sub>. Sumar una constante (a) <b>traslada</b> toda la distribución sin estirarla ni encogerla, así que la DT y la varianza no cambian; solo se desplaza la media (ȳ = a + b·x̄).</p><div class="ej2"><b>Otro ejemplo</b> si sumas 1 punto de regalo a todas las notas, la media sube 1 pero la desviación típica es idéntica. En cambio, si pasas las notas a base 100 multiplicando por 10, la DT también se multiplica por 10.</div>`,
"El coeficiente de variación sirve sobre todo para…": `<p>El coeficiente de variación, CV = (S<sub>x</sub>/x̄)·100, expresa la dispersión en relación con la media, sin unidades. Eso lo hace ideal para comparar la variabilidad de dos variables medidas en escalas distintas o con medias muy diferentes, algo que la desviación típica bruta no permite.</p><div class="ej2"><b>Otro ejemplo</b> ¿qué varía más, el peso de unos adultos (media 70 kg, DT 7 kg) o su estatura (media 1,70 m, DT 0,07 m)? Las DT no son comparables (kg vs m), pero el CV sí: 10 % en ambos, así que varían proporcionalmente lo mismo.</div>`,
"En una distribución con asimetría positiva…": `<p>En una distribución simétrica, media, mediana y moda coinciden. Con asimetría positiva, la cola de valores altos tira de la <b>media</b> hacia la derecha, mientras la mediana, que solo depende de la posición central, se queda quieta: por eso media &gt; mediana. En la negativa ocurre lo contrario.</p><div class="ej2"><b>Otro ejemplo</b> en los ingresos de un país, unos pocos millonarios (cola derecha) elevan la media muy por encima de la mediana. Por eso los informes suelen dar la mediana: representa mejor al ciudadano típico.</div>`,
"¿Qué representación conserva los valores originales de la variable?": `<p>El histograma agrupa los datos en intervalos y representa frecuencias con barras: gana en visión de conjunto pero pierde el valor concreto de cada caso. El diagrama de tallo y hojas ordena los datos mostrando sus dígitos, de modo que <b>no se pierde ningún valor</b> y a la vez se aprecia la forma de la distribución.</p><div class="ej2"><b>Otro ejemplo</b> con las notas 12, 13, 15, 21, 24, el tallo y hojas «1 | 2 3 5 · 2 | 1 4» deja reconstruir las cinco notas exactas; un histograma con intervalos de 10 solo diría «tres casos entre 10-19 y dos entre 20-29».</div>`,
"Un compañero afirma que la media es siempre el mejor índice de tendencia central. Rebate la afirmación.": `<p>Regla práctica: elige el índice según <b>forma de la distribución y escala de la variable</b>. Simétrica y sin atípicos → media (usa toda la información); asimétrica o con atípicos → mediana (resistente); nominal → solo moda.</p><div class="ej2"><b>Otro ejemplo</b> el «tiempo hasta encontrar empleo» suele tener unos pocos casos larguísimos que disparan la media; ahí la mediana («la mitad encontró trabajo antes de X meses») informa mejor que una media inflada.</div>`,
"Explica por qué las puntuaciones diferenciales se elevan al cuadrado al calcular la varianza.": `<p>Idea de fondo: queremos promediar distancias a la media, pero la suma de esas distancias con signo es siempre 0. El cuadrado elimina los signos (y penaliza más las desviaciones grandes); la raíz final devuelve las unidades originales en la desviación típica. Una alternativa, la desviación media (promedio de |x<sub>i</sub>−x̄|), también evita el 0 con el valor absoluto, pero es peor de tratar matemáticamente.</p><div class="ej2"><b>Otro ejemplo</b> con 1, 3, 5 (media 3), las diferenciales −2, 0, +2 suman 0; sus cuadrados 4, 0, 4 suman 8, y S² = 8/3 ≈ 2,67. Sin elevar al cuadrado, el «promedio de distancias con signo» daría 0 y no distinguiría esta serie de otra sin ninguna dispersión.</div>`,
"Dos sucesos son incompatibles cuando su intersección es el conjunto vacío.": `<p>Que dos sucesos sean incompatibles (mutuamente excluyentes) significa que no pueden darse a la vez: A ∩ B = ∅ y P(A∩B) = 0. Es un concepto sobre la <b>coincidencia</b>, distinto de la independencia (que es sobre la <b>influencia</b>). Los incompatibles simplifican la regla de la suma: P(A∪B) = P(A) + P(B).</p><div class="ej2"><b>Otro ejemplo</b> al lanzar un dado, «salir par» y «salir impar» son incompatibles: ningún resultado es las dos cosas. En cambio «par» y «mayor que 3» sí pueden coincidir (el 4 y el 6), así que no lo son.</div>`,
"Al lanzar un dado, la probabilidad de obtener un número mayor que 4 es 2/6.": `<p>Con resultados equiprobables se aplica la regla de Laplace: P = casos favorables / casos posibles. «Mayor que 4» son {5, 6}, dos favorables entre seis: 2/6 ≈ 0,33. El truco está en delimitar bien el suceso: «mayor que 4» no incluye el 4.</p><div class="ej2"><b>Otro ejemplo</b> «mayor o igual que 4» sí incluye el 4: {4, 5, 6}, tres favorables, 3/6 = 0,5. Un matiz en el enunciado cambia el número de casos favorables.</div>`,
"La probabilidad de un suceso se calcula como casos posibles entre casos favorables.": `<p>La probabilidad es <b>favorables entre posibles</b>, nunca al revés. Como los favorables son un subconjunto de los posibles, el resultado queda siempre entre 0 y 1; si sale un número mayor que 1, has invertido la división. 0 es el suceso imposible y 1 el seguro.</p><div class="ej2"><b>Otro ejemplo</b> sacar un corazón de una baraja francesa: 13 favorables / 52 posibles = 0,25. Al revés daría 52/13 = 4, imposible para una probabilidad, lo que delata el error al instante.</div>`,
"Si A = {1,2,3,4} y B = {3,4,5,6}, entonces A − B = {1,2,3}.": `<p>La diferencia A − B son los elementos que están en A pero <b>no</b> en B. Con A = {1,2,3,4} y B = {3,4,5,6}, el 3 y el 4 están en ambos, así que se descartan: A − B = {1, 2}. Ojo, no es simétrica: B − A = {5, 6}.</p><div class="ej2"><b>Otro ejemplo</b> si A = «aprobar mates» y B = «aprobar lengua», A − B es «aprobar mates pero no lengua». Quien aprueba las dos (la intersección) queda fuera de A − B.</div>`,
"La unión de A y B contiene los resultados que pertenecen a uno u otro suceso.": `<p>La unión A ∪ B es el «<b>o</b>»: recoge los resultados que están en A, en B o en ambos. La intersección A ∩ B es el «<b>y</b>»: solo los que están en los dos a la vez. Confundir uno con otro cambia por completo el conjunto de casos favorables.</p><div class="ej2"><b>Otro ejemplo</b> con un dado, A = par = {2,4,6} y B = mayor que 3 = {4,5,6}: la unión (par o mayor que 3) es {2,4,5,6} y la intersección (par y mayor que 3) es {4,6}.</div>`,
"La igualdad P(A∪B) = P(A) + P(B) solo es válida si los sucesos…": `<p>La regla completa de la suma es P(A∪B) = P(A) + P(B) − P(A∩B). Solo cuando los sucesos son incompatibles (A ∩ B = ∅) ese último término es 0 y se puede sumar sin más. Si hay intersección y no la restas, cuentas dos veces la parte común y puedes superar el 1.</p><div class="ej2"><b>Otro ejemplo</b> P(par o mayor que 3) con un dado: P(par)=3/6, P(&gt;3)=3/6, pero P(par y &gt;3)=P({4,6})=2/6, así que P(unión)=3/6+3/6−2/6 = 4/6, no 6/6.</div>`,
"Si P(A|B) = P(A), los sucesos son…": `<p>La independencia se define justo así: P(A|B) = P(A), es decir, saber que ha ocurrido B no altera la probabilidad de A. Su consecuencia práctica es la regla del producto simple: P(A∩B) = P(A)·P(B). Es distinto de incompatibles, donde saber que ocurrió B lleva P(A) a 0.</p><div class="ej2"><b>Otro ejemplo</b> dos lanzamientos de moneda son independientes: haber sacado cara antes no cambia la probabilidad de cara ahora (sigue siendo 1/2). Sacar dos caras seguidas tiene probabilidad 1/2 · 1/2 = 1/4.</div>`,
"Al lanzar un dado no trucado, P(número ≥ 5) vale…": `<p>«Mayor o igual que 5» incluye el 5: son {5, 6}, dos favorables de seis, 2/6. Delimitar el suceso con cuidado (≥ incluye el extremo, &gt; no) es la fuente de error más habitual en estos ítems.</p><div class="ej2"><b>Otro ejemplo</b> «menor que 3» son {1, 2} → 2/6; «menor o igual que 3» son {1, 2, 3} → 3/6. El mismo número, el 3, entra o no según el símbolo.</div>`,
"El suceso imposible tiene probabilidad…": `<p>El suceso imposible (∅) no ocurre nunca: su probabilidad es 0, sea cual sea el tamaño de la muestra o el número de repeticiones. En el otro extremo, el suceso seguro (todo el espacio muestral) tiene probabilidad 1. Cualquier otro suceso cae entre esos dos valores.</p><div class="ej2"><b>Otro ejemplo</b> «sacar un 7 con un dado de seis caras» es imposible (P = 0); «sacar un número del 1 al 6» es seguro (P = 1). Lanzar el dado mil veces no cambia ninguna de las dos.</div>`,
"Con α = 0,05, un contraste que arroja p = 0,03 lleva a…": `<p>La regla de decisión compara la p obtenida con el nivel α fijado de antemano: si p &lt; α se rechaza H₀ (el resultado es «demasiado raro» para el azar); si p &gt; α se mantiene. Con α = 0,05 y p = 0,03, como 0,03 &lt; 0,05, se rechaza H₀.</p><div class="ej2"><b>Otro ejemplo</b> con ese mismo α = 0,05, una p = 0,07 llevaría a <b>mantener</b> H₀: está por encima del umbral, así que la diferencia es compatible con el azar. El umbral es una raya fija; lo que cambia es de qué lado cae la p.</div>`,
"Explica la diferencia entre sucesos incompatibles y sucesos independientes.": `<p>Resumen operativo: incompatibles → regla de la <b>suma</b> (P(A∪B)=P(A)+P(B)); independientes → regla del <b>producto</b> (P(A∩B)=P(A)·P(B)). Y una consecuencia de examen: dos sucesos con probabilidad no nula que son incompatibles son forzosamente dependientes.</p><div class="ej2"><b>Otro ejemplo</b> «sacar as» y «sacar rey» en una extracción son incompatibles (una carta no es as y rey a la vez), y por eso dependientes: si sé que salió as, la de rey pasa a 0. En cambio, «as en la 1.ª carta» y «as en la 2.ª con reemplazo» son independientes.</div>`,
"¿Qué significa exactamente «mantener H₀»? ¿Por qué no se dice «aceptar H₀»?": `<p>Matiz clave: no rechazar H₀ no prueba que sea cierta; puede que el efecto exista pero la muestra sea demasiado pequeña para detectarlo (error tipo II, falta de potencia). Por eso se dice «no hay evidencia suficiente», no «se ha demostrado que no hay efecto».</p><div class="ej2"><b>Otro ejemplo</b> un juicio: no condenar al acusado (mantener H₀ de inocencia) no demuestra que sea inocente, sino que no hubo pruebas suficientes para condenarlo. La duda se resuelve a favor de H₀ por defecto.</div>`,
"La asociación entre dos variables es condición necesaria pero no suficiente para la causalidad.": `<p>Para afirmar causalidad hacen falta tres cosas: (1) <b>covariación</b> (que las variables se asocien), (2) <b>precedencia temporal</b> (que la causa anteceda al efecto) y (3) <b>ausencia de relación espuria</b> (que no haya una tercera variable explicándolo todo). La asociación es solo el primer requisito: imprescindible, pero insuficiente por sí sola.</p><div class="ej2"><b>Otro ejemplo</b> el número de bomberos en un incendio correlaciona con los daños, pero no los causa: la tercera variable, el tamaño del fuego, provoca ambas cosas. Hay covariación sin causalidad.</div>`,
"La covarianza está acotada entre −1 y +1.": `<p>La covarianza informa de la dirección (por su signo) pero no de la intensidad: va de −∞ a +∞ y su magnitud depende de las unidades, así que no es comparable entre estudios. La <b>correlación de Pearson</b> es la covarianza estandarizada (dividida por el producto de las DT), y esa sí está acotada entre −1 y +1.</p><div class="ej2"><b>Otro ejemplo</b> si mides la altura en centímetros en lugar de metros, la covarianza altura-peso se multiplica por 100 aunque la relación sea la misma; la correlación no se inmuta: sigue valiendo lo mismo.</div>`,
"El coeficiente de determinación puede tomar valores negativos.": `<p>El coeficiente de determinación es r², un cuadrado, así que nunca es negativo: va de 0 (X no explica nada de Y) a 1 (la explica del todo). Quien lleva el signo, y por tanto la dirección de la relación, es r. r² se lee como proporción (o porcentaje) de varianza compartida.</p><div class="ej2"><b>Otro ejemplo</b> tanto r = −0,7 como r = +0,7 dan r² = 0,49: en ambos casos una variable explica el 49 % de la varianza de la otra. El signo dice si la relación es directa o inversa, no cuánta varianza se comparte.</div>`,
"Phi se emplea cuando la tabla de contingencia es 2×2.": `<p>Tras un χ² significativo hace falta un índice acotado que mida la intensidad. Para tablas 2×2 se usa φ = √(χ²/n); para tablas mayores, la V de Cramer = √(χ²/(n(k−1))), con k el número de categorías de la variable que menos tiene. Ambos van de 0 a 1 y se leen como una correlación.</p><div class="ej2"><b>Otro ejemplo</b> «sexo (H/M) × fuma (sí/no)» es 2×2 → φ. «Nivel de estudios (3 niveles) × voto (4 partidos)» es 3×4 → V de Cramer con k = 3.</div>`,
"El ji-cuadrado informa de la intensidad de la asociación.": `<p>χ² solo decide <b>si</b> hay asociación, no <b>cuánta</b>. Sus tres limitaciones: no está acotado (0 a +∞), depende del tamaño muestral (a más n, mayor χ² aunque la relación sea la misma) y, por eso, no mide intensidad. La intensidad la dan φ o V de Cramer.</p><div class="ej2"><b>Otro ejemplo</b> la misma tabla de proporciones con n = 100 podría dar χ² = 8 y con n = 1.000 dar χ² = 80: diez veces mayor sin que la asociación real cambie. La V de Cramer, en cambio, saldría casi igual.</div>`,
"La covarianza entre dos variables vale −4,3. Eso indica…": `<p>En la covarianza solo es interpretable el <b>signo</b>: negativo indica relación inversa (cuando una variable sube, la otra tiende a bajar). El 4,3 no dice si la relación es fuerte o débil, porque depende de las unidades. Para calibrar la intensidad habría que pasar a la correlación.</p><div class="ej2"><b>Otro ejemplo</b> horas de móvil y horas de sueño suelen dar covarianza negativa (más móvil, menos sueño), pero una covarianza de −4,3 podría corresponder a una r de −0,2 o de −0,8 según las escalas: sin r no se sabe.</div>`,
"Si r = 0,50, el porcentaje de varianza que queda SIN explicar es…": `<p>Para pasar de correlación a varianza explicada hay que <b>elevar r al cuadrado</b>: r = 0,50 → r² = 0,25, o sea un 25 % explicado y, por tanto, un 75 % sin explicar. El error clásico es confundir r con el porcentaje: 0,50 no es «el 50 % explicado».</p><div class="ej2"><b>Otro ejemplo</b> una r = 0,30, que parece apreciable, solo explica r² = 0,09, un 9 % de la varianza: queda un 91 % por explicar. Las correlaciones «se encogen» bastante al pasar a determinación.</div>`,
"En una tabla de contingencia de 4×3, la intensidad de la asociación se mide con…": `<p>En tablas mayores de 2×2 la intensidad se mide con la V de Cramer, cuya fórmula usa k = número de categorías de la variable que <b>menos</b> tiene. En una 4×3 esa variable tiene 3 categorías, así que k = 3. Phi se reserva para las 2×2 y Pearson para dos cuantitativas.</p><div class="ej2"><b>Otro ejemplo</b> en una tabla 5×2 (cinco grupos de edad × dos sexos), k = 2; V = √(χ²/(n·(2−1))) = √(χ²/n), que en tablas con k = 2 coincide con phi.</div>`,
"Una frecuencia esperada de una casilla se calcula como…": `<p>La frecuencia esperada de una casilla es la que habría <b>si las variables fueran independientes</b>, y se obtiene multiplicando el total de su fila por el total de su columna y dividiendo entre n. Comparar observadas con esperadas, celda a celda, es la base del χ².</p><div class="ej2"><b>Otro ejemplo</b> en una tabla de 200 personas donde una fila suma 80 y una columna 50, la casilla que cruzan tiene esperada 80·50/200 = 20. Si la observada es 35, esa casilla aporta mucho al χ² porque se aleja de lo esperado bajo independencia.</div>`,
"Que r sea alta permite concluir…": `<p>Una r alta solo autoriza a afirmar <b>covariación</b>: que las dos variables se mueven juntas. No prueba causalidad (faltarían precedencia temporal y descarte de terceras variables) ni establece cuál causa cuál. Ese salto indebido de «correlacionan» a «una causa la otra» es el error estrella del tema.</p><div class="ej2"><b>Otro ejemplo</b> ventas de helados y ahogamientos correlacionan alto, pero ninguno causa el otro: la tercera variable «calor del verano» sube ambos. Covarían, pero no hay vínculo causal directo.</div>`,
"El consumo de queso en EE. UU. y las muertes por enredarse con las sábanas correlacionan a r = 0,94. Explica qué está ocurriendo.": `<p>La lección: una correlación altísima puede no significar nada si una tercera variable mueve las dos series a la vez. Aquí el paso del tiempo hace crecer independientemente el consumo de queso y esas muertes; correlacionarlas solo captura la tendencia común. Sin teoría previa ni descarte de terceras variables, la magnitud de r no debe leerse sola.</p><div class="ej2"><b>Otro ejemplo</b> el número de piscinas y el de doctorados de una ciudad correlacionan, pero la variable oculta es la riqueza/población: las zonas más ricas y pobladas tienen más de ambas cosas. Es correlación espuria, no causa.</div>`,
"¿Por qué el ji-cuadrado necesita acompañarse de phi o de V de Cramer?": `<p>Reparto de tareas: χ² decide <b>si</b> hay asociación; φ o V de Cramer dicen <b>cuánta</b>, con un índice acotado (0–1) que no depende de n. Por eso la práctica correcta es informar de los dos juntos.</p><div class="ej2"><b>Otro ejemplo</b> un estudio con n = 5.000 puede dar χ² = 40 «muy significativo» y a la vez una V de Cramer de 0,08, es decir, una asociación real pero trivial. Sin la V, el χ² grande engañaría haciendo creer que la relación es fuerte.</div>`,
"Un estadístico deseable es consistente, eficiente, suficiente y sesgado.": `<p>Las cuatro propiedades deseables de un buen estimador son <b>insesgado</b> (su media coincide con el parámetro), <b>eficiente</b> (mínima varianza), <b>consistente</b> (se acerca al parámetro al crecer n) y <b>suficiente</b> (aprovecha toda la información de la muestra). «Sesgado» es justo lo contrario de lo que se busca: la palabra correcta era insesgado.</p><div class="ej2"><b>Otro ejemplo</b> la media muestral x̄ es un estimador insesgado de μ: si promediaras las x̄ de todas las muestras posibles, obtendrías exactamente μ. Un estimador sesgado erraría siempre hacia arriba o hacia abajo.</div>`,
"A mayor tamaño muestral, menor error de estimación y mayor precisión.": `<p>El error estándar EE = σ/√n mide la variabilidad de las medias muestrales: cuanto mayor es n, menor es el EE y más se estrechan los intervalos de confianza, es decir, más precisa es la estimación. Eso sí, interviene √n, no n, así que la ganancia es cada vez menor.</p><div class="ej2"><b>Otro ejemplo</b> con σ = 10, pasar de n = 25 (EE = 2) a n = 100 (EE = 1) divide el error entre 2, pero para volver a dividirlo entre 2 (EE = 0,5) hace falta n = 400: cuadruplicar la muestra para reducir el error a la mitad.</div>`,
"Los muestreos no probabilísticos aseguran muestras representativas.": `<p>Solo los muestreos <b>probabilísticos</b> (donde cada elemento tiene una probabilidad conocida y no nula de ser elegido) permiten estimar el error y sostener la representatividad. Los no probabilísticos (por conveniencia, cuotas, bola de nieve) son útiles y baratos, pero la representatividad ni se asegura ni se puede cuantificar.</p><div class="ej2"><b>Otro ejemplo</b> encuestar a la salida de una facultad de Psicología sobre hábitos de estudio es muestreo por conveniencia: rápido, pero sesgado hacia cierto perfil. Un muestreo aleatorio del padrón daría una imagen mucho más representativa.</div>`,
"Cuando la media muestral es igual a la media poblacional, el valor z es 0.": `<p>El estadístico z = (x̄ − μ)/EE mide a cuántos errores estándar está la media muestral de la poblacional. Si x̄ coincide con μ, el numerador es 0 y z = 0: la muestra cae justo en el centro de la distribución muestral, el resultado menos «sorprendente» posible.</p><div class="ej2"><b>Otro ejemplo</b> si μ = 100, EE = 5 y obtienes x̄ = 110, entonces z = (110−100)/5 = 2: tu media está a dos errores estándar por encima, un valor ya bastante alejado del centro.</div>`,
"Con α = 0,01, la zona de rechazo total es mayor en un contraste bilateral que en uno unilateral derecho.": `<p>El área total de rechazo es siempre α, aquí 0,01, tanto en el bilateral como en el unilateral: lo que cambia es cómo se reparte. Bilateral: 0,005 en cada cola. Unilateral: los 0,01 enteros en una cola. Por eso el valor crítico unilateral queda más cerca del centro (más fácil rechazar en esa dirección), pero el área total es idéntica.</p><div class="ej2"><b>Otro ejemplo</b> con α = 0,05: bilateral reparte 0,025 + 0,025 (z críticos ±1,96); unilateral pone los 0,05 en una cola (z crítico 1,645). Mismo 5 % total, distinta colocación.</div>`,
"El error estándar de la media es…": `<p>El error estándar de la media es σ/√n: la desviación típica de la <b>distribución muestral</b> de la media, no la de los datos. Siempre es menor que σ porque promediar varios valores «suaviza» la variabilidad, y decrece con la raíz de n. No confundir con σ²/n, que es la varianza de esa distribución.</p><div class="ej2"><b>Otro ejemplo</b> con σ = 15 y n = 9, EE = 15/3 = 5: aunque los individuos varían con DT 15, las medias de muestras de 9 varían mucho menos, con DT 5.</div>`,
"Si el tamaño muestral pasa de 100 a 400, el error estándar…": `<p>Como el EE depende de √n, multiplicar n por 4 divide el error entre √4 = 2, no entre 4. Es el rendimiento decreciente del tamaño muestral: cada nueva reducción del error cuesta cada vez más sujetos.</p><div class="ej2"><b>Otro ejemplo</b> para dividir el EE entre 3 no basta con triplicar n: hay que multiplicarlo por 9 (de 100 a 900), porque √9 = 3.</div>`,
"Con α = 0,01 y contraste bilateral, los valores críticos de z son aproximadamente…": `<p>Conviene tener memorizados los valores críticos de z: ±1,96 para α = 0,05 bilateral, ±2,58 para α = 0,01 bilateral y 1,645 para α = 0,05 unilateral. Al reducir α de 0,05 a 0,01 exiges más evidencia, así que el valor crítico se aleja del centro (de 1,96 a 2,58).</p><div class="ej2"><b>Otro ejemplo</b> un z de contraste de 2,20 sería significativo con α = 0,05 (supera 1,96) pero <b>no</b> con α = 0,01 (no llega a 2,58): el mismo dato decide distinto según el listón.</div>`,
"Rechazar H₀ cuando en realidad es verdadera es…": `<p>Rechazar H₀ siendo verdadera es el <b>error tipo I</b> (falso positivo): afirmar que hay efecto cuando no lo hay. Su probabilidad es justo α, el nivel de significación. El error tipo II (β) es el contrario: mantener H₀ siendo falsa, no detectar un efecto que sí existe.</p><div class="ej2"><b>Otro ejemplo</b> en una prueba médica, el tipo I es un falso positivo (decir que el paciente está enfermo cuando está sano) y el tipo II un falso negativo (darlo por sano cuando está enfermo). Bajar α reduce los falsos positivos pero, a igualdad de todo, sube los falsos negativos.</div>`,
"Se emplea la distribución t de Student cuando…": `<p>El criterio para elegir entre normal y t es si conocemos la varianza poblacional: con σ <b>conocida</b> se usa z; con σ <b>desconocida</b> se estima con la cuasivarianza S² y esa incertidumbre añadida la recoge la t de Student, con gl = n − 1. El tamaño muestral influye en cuánto se parecen (con n grande, t ≈ normal), pero no es el criterio de elección.</p><div class="ej2"><b>Otro ejemplo</b> con n = 15 y σ desconocida usas t con 14 gl, cuyos valores críticos son algo mayores que los de z (colas más anchas). Con n = 500, la t está tan pegada a la normal que en la práctica se usa z.</div>`,
"Explica el Teorema Central del Límite y por qué es la pieza que hace posible la inferencia.": `<p>Lo esencial: el TCL nos regala una distribución <b>conocida</b> (la normal) para la media muestral, pase lo que pase con la forma de la variable original. Sin esa garantía no podríamos asignar probabilidades a los valores del estadístico, y sin probabilidades no hay intervalos ni contrastes.</p><div class="ej2"><b>Otro ejemplo</b> el gasto diario de los clientes de una tienda es muy asimétrico (muchos gastan poco, unos pocos muchísimo). Aun así, si tomas muestras de 50 clientes y promedias, esas medias se distribuyen de forma casi normal alrededor de μ, y por eso puedes construir un IC para el gasto medio.</div>`,
"Explica la diferencia entre significación estadística y relevancia práctica.": `<p>Idea central: la significación depende de √n, así que con muestras enormes casi cualquier diferencia se vuelve significativa aunque sea trivial. Significativo no es sinónimo de importante; por eso conviene acompañar el contraste con una medida de la magnitud (tamaño del efecto o un intervalo de confianza).</p><div class="ej2"><b>Otro ejemplo</b> un fármaco que baja la tensión 0,5 mmHg de media puede salir «significativo» con n = 20.000 pacientes, pero esa bajada es clínicamente irrelevante. Al revés, un efecto grande en un estudio de n = 8 puede no alcanzar significación por falta de potencia y aun así merecer más investigación.</div>`
};

const $ = (s,r)=> (r||document).querySelector(s);
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
function fecha(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); }
function normCdf(z){
  const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989422804014327*Math.exp(-z*z/2);
  const p=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>0?1-p:p;
}
const num = (x,n)=> x.toFixed(n).replace(".",",");
const slug = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")  .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");

/* ============ CABECERA ============ */
function cabecera(){
  const ex = fecha("2026-12-11");
  const dias = Math.max(0, Math.round((ex-HOY)/864e5));
  const total = CAL.filter(d=>d.tipo==="sesion"||d.tipo==="repaso").length;
  const n = Object.values(hechos).filter(Boolean).length;
  $("#quedan").textContent = dias;
  $("#hechas").textContent = n;
  $("#total").textContent = total;
  $("#barfill").style.width = (total? n/total*100:0)+"%";
  const h = CAL.find(d=>fecha(d.f).getTime()===HOY.getTime());
  $("#hoylab").textContent = h ? "Hoy · "+h.tit : "";
}

/* ============ CALENDARIO ============ */
let calDestacado = null;   // fecha (f) del día de hoy o la próxima sesión
function diaDeHoy(){
  const hoyT = HOY.getTime();
  const exact = CAL.find(d=>fecha(d.f).getTime()===hoyT);
  if(exact) return {d:exact, estado:"hoy"};
  const fut = CAL.filter(d=>fecha(d.f).getTime()>hoyT);
  if(fut.length) return {d:fut[0], estado:"prox"};
  return {d:null, estado:"fin"};
}
function pintaCalendario(){
  calDestacado = (diaDeHoy().d || {}).f || null;
  const semanas = [];
  CAL.forEach(d=>{
    const f = fecha(d.f);
    const wk = Math.floor((f - fecha("2026-09-07"))/(7*864e5));
    (semanas[wk] = semanas[wk] || []).push(d);
  });
  const html = semanas.map((dias,i)=>{
    const a = fecha(dias[0].f), b = fecha(dias[dias.length-1].f);
    const rango = `${a.getDate()} ${MES[a.getMonth()]} – ${b.getDate()} ${MES[b.getMonth()]}`;
    return `<div class="week">
      <div class="wmeta">
        <div class="wnum">SEMANA ${String(i+1).padStart(2,"0")}</div>
        <div class="wobj">${SEM[i]||""}</div>
        <div class="wrange">${rango}</div>
      </div>
      <div class="days">${dias.map(d=>tarjetaDia(d)).join("")}</div>
    </div>`;
  }).join("");
  $("#p-calendario").innerHTML = `
    <div class="hd">
      <div>
        <div class="eyebrow">7 de septiembre → 11 de diciembre de 2026</div>
        <h2>Plan de estudio</h2>
        <p class="lead">Una hora al día, de lunes a viernes. Sesenta y siete sesiones repartidas por temas,
        con dos días festivos de colchón y dos semanas finales de repaso. Marca cada día al terminarlo.</p>
      </div>
      <div class="chips">
        <button class="chip" id="hoy-btn">Ir a hoy</button>
        <button class="chip" id="reset-cal">Reiniciar marcas</button>
      </div>
    </div>
    <div class="cal-wrap">
      <div class="cal-weeks">${html}</div>
      <aside class="cal-hoy" id="cal-hoy">${panelHoyHTML()}</aside>
    </div>`;
  $("#hoy-btn").onclick = ()=>{
    const el = document.querySelector(".day.hoy") || document.querySelector(".day.prox") || document.querySelector(".day");
    if(el) el.scrollIntoView({block:"center",behavior:"smooth"});
  };
  $("#reset-cal").onclick = ()=>{ hechos={}; store.set("ea-dias",hechos); pintaCalendario(); cabecera(); };
  $("#cal-hoy").querySelectorAll("[data-goto]").forEach(b=>
    b.onclick = ()=> calNavega(b.dataset.goto, b.dataset.tema||null));
  const verBtn = $("#cal-hoy .ch-ver");
  if(verBtn) verBtn.onclick = ()=>{
    const el = document.querySelector(".day.hoy") || document.querySelector(".day.prox") || document.querySelector(".day");
    if(el) el.scrollIntoView({block:"center",behavior:"smooth"});
  };
  $("#p-calendario").addEventListener("click",e=>{
    const t = e.target.closest(".tick"); if(!t) return;
    const k = t.dataset.f;
    hechos[k] = !hechos[k];
    store.set("ea-dias",hechos);
    t.setAttribute("aria-pressed", !!hechos[k]);
    t.textContent = hechos[k] ? "✓" : "";
    t.closest(".day").classList.toggle("done", !!hechos[k]);
    cabecera();
    syncProgreso(k, hechos[k]);
  });
}
function tarjetaDia(d){
  const f = fecha(d.f);
  const esHoy = f.getTime()===HOY.getTime();
  const esProx = !esHoy && d.f===calDestacado;
  const cls = ["day", d.tipo, hechos[d.f]?"done":"", esHoy?"hoy":"", esProx?"prox":""].filter(Boolean).join(" ");
  const marcable = d.tipo==="sesion"||d.tipo==="repaso";
  return `<article class="${cls}">
    <div class="dtop">
      <span class="dfecha">${DIA[f.getDay()]} ${f.getDate()} ${MES[f.getMonth()]}${d.tema!=="—"&&d.tema!=="EX"?" · "+d.tema:""}</span>
      ${marcable?`<button class="tick" data-f="${d.f}" aria-pressed="${!!hechos[d.f]}"
        aria-label="Marcar sesión">${hechos[d.f]?"✓":""}</button>`:""}
    </div>
    <div class="dtit">${d.tit}</div>
    <div class="dcont">${d.cont}</div>
    ${d.tarea?`<div class="dtarea">${d.tarea}</div>`:""}
    ${marcable?notaHTML("sesion", d.f, "Qué te ha costado, qué dejas pendiente…"):""}
  </article>`;
}
/* panel lateral: el día de hoy con enlaces directos a cada apartado */
function panelHoyHTML(){
  const {d, estado} = diaDeHoy();
  if(!d) return `<div class="cal-hoy-card">
    <div class="ch-kick"><span class="ch-dot"></span>Curso terminado</div>
    <h3 class="ch-tit">¡Suerte en el examen!</h3>
    <p class="ch-cont">El plan ha llegado a su fin. Repasa el formulario y el recordatorio.</p>
    <div class="ch-label">Ir directo a</div>
    <div class="ch-links">
      <button data-goto="recordatorio">Recordatorio<span class="ch-arr">↗</span></button>
      <button data-goto="formulas">Fórmulas<span class="ch-arr">↗</span></button>
    </div></div>`;
  const f = fecha(d.f);
  const wk = Math.floor((f - fecha("2026-09-07"))/(7*864e5)) + 1;
  const tema = /^T[1-5]$/.test(d.tema) ? d.tema : null;
  const T = tema ? TEMAS.find(t=>t.id===tema) : null;
  const kick = estado==="hoy" ? "Hoy es tu sesión" : "Próxima sesión";
  const fechaTxt = `${DIA[f.getDay()]} ${f.getDate()} ${MES[f.getMonth()]}`.toUpperCase();
  const festivo = d.tipo==="festivo";
  const links = [
    ["temario",    tema?`Temario · Tema ${T.n}`:"Temario"],
    ["formulas",   tema?`Fórmulas del tema ${T.n}`:"Fórmulas"],
    ["ejercicios", tema?`Ejercicios del tema ${T.n}`:"Ejercicios"],
    ["spss",       "Ejercicios SPSS"],
    ["recordatorio","Recordatorio"]
  ];
  return `<div class="cal-hoy-card">
    <div class="ch-kick"><span class="ch-dot"></span>${kick}</div>
    <div class="ch-fecha">${fechaTxt} · Semana ${String(wk).padStart(2,"0")}</div>
    ${(d.tema!=="—"&&d.tema!=="EX")?`<span class="ch-badge">${tema?("Tema "+T.n):d.tema}</span>`:""}
    <h3 class="ch-tit">${d.tit}</h3>
    <div class="ch-label">${festivo?"Sobre el día":"Conceptos del día a estudiar"}</div>
    <p class="ch-cont">${d.cont}</p>
    ${d.tarea?`<div class="ch-tarea"><b>Tarea</b> ${d.tarea}</div>`:""}
    <div class="ch-label">Ir directo a</div>
    <div class="ch-links">
      ${links.map(([g,l])=>`<button data-goto="${g}"${tema?` data-tema="${tema}"`:""}>${l}<span class="ch-arr">↗</span></button>`).join("")}
    </div>
    <button class="ch-ver">Ver el día en el calendario</button>
  </div>`;
}
/* enlaces del panel: cambia de pestaña y deja el apartado en el tema del día */
function calNavega(goto, tema){
  if(goto==="temario"){
    if(tema){ temaSel=tema; store.set("ea-tema",temaSel); pintaTemas(); }
    activaPanel("temas");
  }else if(goto==="formulas"){
    filtroF="all"; pintaFormulas(); activaPanel("formulas");
    if(tema) setTimeout(()=>{ const el=document.querySelector('.bloque[data-tema="'+tema+'"]');
      if(el) el.scrollIntoView({block:"start",behavior:"smooth"}); }, 40);
  }else if(goto==="ejercicios"){
    filtroTema = tema||"all"; filtroTipo="all"; pintaEjercicios(); activaPanel("ejercicios");
  }else if(goto==="spss"){
    activaPanel("spss");
  }else if(goto==="recordatorio"){
    activaPanel("recordatorio");
  }
}

"T3|Probabilidad condicionada e independencia":"P(enfermo | test positivo) puede ser muy distinta de P(enfermo): el test cambia lo que sabemos. Si fueran <b>independientes</b> (el test no informara), P(enfermo | positivo) = P(enfermo) y el test sería inútil.",
"T3|De la probabilidad al contraste de hipótesis":"Lanzas una moneda 10 veces y salen 10 caras. Bajo H₀ «la moneda es justa» eso es rarísimo (p muy baja), así que rechazas H₀. La probabilidad es la <b>vara de medir</b> lo sorprendente que es tu resultado si H₀ fuera cierta.",

"T4|Asociación y causalidad":"El número de bomberos en un incendio correlaciona con los daños, pero no los causa: una <b>tercera variable</b> (el tamaño del fuego) provoca ambas cosas a la vez. Asociación hay; causalidad, no.",
"T4|Covarianza":"Horas de estudio y nota suelen tener covarianza <b>positiva</b> (a más horas, más nota). Pero si mides el estudio en minutos en vez de horas, el número cambia por completo aunque la relación sea la misma: por eso la covarianza sola no es interpretable.",
"T4|Correlación de Pearson":"Una <b>r = −0,85</b> entre horas de móvil y horas de sueño: relación fuerte y negativa (más móvil, menos sueño). El signo da la dirección; el 0,85 (cerca de 1) da la fuerza. Y es comparable entre estudios porque siempre va de −1 a +1.",
"T4|Coeficiente de determinación":"Si la r entre motivación y rendimiento es 0,40, entonces <b>r² = 0,16</b>: la motivación explica el 16 % de las diferencias de rendimiento; el 84 % restante son otras cosas. Elevar al cuadrado siempre encoge la cifra.",
"T4|Dos variables categóricas: ji-cuadrado":"Cruzas «fuma (sí/no)» con «tiene tos (sí/no)». Si fumar y toser fueran independientes, esperarías unas frecuencias concretas; <b>χ²</b> mide cuánto se apartan las observadas de esas esperadas. Como no está acotado, luego das <b>φ</b> para saber si la relación es fuerte o débil.",
"T4|Una cuantitativa y una categórica":"Comparar el estrés (cuantitativo) entre tres tratamientos (categórico): un <b>diagrama de cajas</b> por grupo enseña de un vistazo qué tratamiento tiene la mediana más baja y cuál dispersa más.",

"T5|Qué es inferir":"No puedes preguntar la altura a <i>todos</i> los españoles (parámetro μ, desconocido). Mides a 1.000 (estadístico x̄) y desde ahí estimas μ o pones a prueba si «μ = 175». Eso es <b>inferir</b>: ir de la muestra a la población.",
"T5|Muestreo y representatividad":"Una encuesta con 50.000 respuestas voluntarias por internet puede estar más sesgada que una de 1.000 elegidas al azar: el <b>tamaño no arregla un muestreo malo</b>. Responden los más motivados, no un reflejo de la población.",
"T5|La distribución normal y la tipificación":"Un CI de 130 en una N(100, 15): z = (130 − 100)/15 = <b>2</b>. Está 2 desviaciones típicas por encima; por la regla del 95 %, solo un ~2,5 % de la gente lo supera. La z pone cualquier escala en el mismo lenguaje.",
"T5|Distribución muestral de un estadístico":"Si sacas muchas muestras de 100 personas y anotas la media de cada una, esas medias forman su <i>propia</i> distribución. El <b>error muestral</b> de una media concreta es lo que se aparta de μ: con μ = 300 y una media de 333, el error es +33.",
"T5|Teorema Central del Límite":"Los ingresos <b>no</b> son normales (son asimétricos), pero si tomas medias de muestras de 100 personas, esas medias sí se reparten en forma de campana. Por eso puedes usar la normal para la media aunque la variable original no lo sea.",
"T5|Estimación puntual y error estándar":"Con σ = 20 y n = 100, EE = 20/√100 = <b>2</b>. Si subes a n = 400, EE = 20/√400 = <b>1</b>: para reducir el error a la mitad hay que <b>cuadruplicar</b> la muestra, no doblarla.",
"T5|Intervalos de confianza":"Un IC del 95 % para la media de sueño que da <b>[6,8; 7,4] horas</b> significa que el método, repetido muchas veces, atrapa la media real el 95 % de las veces. Cuanto mayor es n, más estrecho (y más preciso) es el intervalo.",
"T5|Contraste de hipótesis":"Quieres ver si un curso sube la nota media por encima de 5 (H₀: μ = 5; H₁: μ &gt; 5, unilateral derecho). Calculas el estadístico y, si cae en la zona crítica, rechazas H₀. Si no, la <b>mantienes</b>: nunca se «acepta» H₀.",
"T5|Aciertos, errores y relevancia":"Un fármaco baja la tensión 0,3 mmHg con n = 100.000: sale «significativo» (p &lt; 0,05) pero es clínicamente irrelevante. <b>Significación estadística ≠ importancia práctica</b>; con muestras enormes casi todo sale significativo."
};

      <ol class="pasos">${c.pasos.map(p=>`

      <div class="resu"><b>Resultado</b>${c.res}</div>

      ${(c.spss||c.excel)?`<div class="tools">

}
